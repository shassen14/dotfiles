# playbook.yml: Main playbook orchestrating the setup.
# Imports other playbooks for modularity.

# Initial setup: Chezmoi first to get core dotfiles
- name: Setup Chezmoi and core dotfiles
  import_playbook: playbooks/chezmoi.yml
  tags: [always, chezmoi, config] # Run chezmoi setup always

# Core Development Tools
- name: Setup Git and GitHub CLI
  import_playbook: playbooks/git.yml
  tags: [git, tools, dev]

- name: Setup Tmux
  import_playbook: playbooks/tmux.yml
  tags: [tmux, tools, cli]

- name: Setup VS Code
  import_playbook: playbooks/vscode.yml
  tags: [vscode, editor, tools, gui]

- name: Setup Neovim
  import_playbook: playbooks/neovim.yml
  tags: [neovim, nvim, editor, tools, cli, dev]

# Containerization
- name: Setup Docker
  import_playbook: playbooks/docker.yml
  tags: [docker, tools, dev]

# Misc
- name: Setup Obsidian
  import_playbook: playbooks/obsidian.yml
  tags: [obsidian, notes, tools, gui]

- name: Setup Discord
  import_playbook: playbooks/discord.yml
  tags: [discord, app, communication, gui]

- name: Setup Spotify
  import_playbook: playbooks/spotify.yml
  tags: [spotify, app, multimedia, gui]

- name: Setup Aldente (macOS Only)
  import_playbook: playbooks/aldente.yml
  tags: [aldente, app, macos, gui, utility]

# Security / Password Management
- name: Setup Bitwarden
  import_playbook: playbooks/bitwarden.yml
  tags: [bitwarden, app, security, passwordmanager, gui]

# Shell Setup (Install zsh/bash, starship, set defaults)
- name: Configure Shell Environment
  import_playbook: playbooks/shell_setup.yml
  tags: [shell, config]