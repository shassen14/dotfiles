# playbook.yml: Main playbook orchestrating the setup.
# Imports other playbooks for modularity.

# Initial setup: Chezmoi first to get core dotfiles
- name: Setup Chezmoi and core dotfiles
  import_playbook: playbooks/chezmoi.yml
  tags: [always, chezmoi, config] # Run chezmoi setup always

- name: Install Foundational Development Prerequisites and Language Toolchains
  import_playbook: playbooks/dev_prerequisites.yml
  tags: [always, prerequisites, dev]

# OS-Specific Cleanup (Run this early, after core setup but before installing too much)
- name: Debloat Ubuntu/Debian Systems
  import_playbook: playbooks/ubuntu_debloat.yml
  when: ansible_os_family == "Debian" # <--- Crucial condition
  tags: [debloat, cleanup, os_specific, ubuntu, debian]

# Core Development Tools
- name: Setup Git and GitHub CLI
  import_playbook: playbooks/git.yml
  tags: [git, tools, dev]

# - name: Setup Rust Language Toolchain
#   import_playbook: playbooks/rust.yml
#   tags: [rust, rustup, dev, compiler, prerequisites]

- name: Setup Tmux
  import_playbook: playbooks/tmux.yml
  tags: [tmux, tools, cli]

- name: Setup VS Code
  import_playbook: playbooks/vscode.yml
  tags: [vscode, editor, tools, gui]

- name: Install Brave Browser
  import_playbook: playbooks/brave.yml
  tags: [brave, browser, app, gui]

- name: Setup Neovim
  import_playbook: playbooks/neovim.yml
  tags: [neovim, nvim, editor, tools, cli, dev]

# Fonts for terminal output
- name: Install Nerd Fonts
  import_playbook: playbooks/nerdfonts.yml
  tags: [fonts, nerdfonts, gui, prerequisites]

# Containerization
- name: Setup Docker
  import_playbook: playbooks/docker.yml
  tags: [docker, tools, dev]

- name: Build and Install Alacritty from Source (Linux Only) # New Import
  import_playbook: playbooks/alacritty_source_build.yml
  when: ansible_os_family != "Darwin"
  tags: [alacritty, terminal, tools, gui, sourcebuild]

- name: Install Alacritty via Homebrew (macOS Only) # Keep the simpler macOS install
  import_playbook: playbooks/alacritty.yml
  when: ansible_os_family == "Darwin"
  tags: [alacritty, terminal, tools, gui]

# Misc
- name: Setup Obsidian
  import_playbook: playbooks/obsidian.yml
  tags: [obsidian, notes, tools, gui]

- name: Setup Discord
  import_playbook: playbooks/discord.yml
  tags: [discord, app, communication, gui]

- name: Setup Spotify
  import_playbook: playbooks/spotify.yml
  tags: [spotify, app, multimedia, gui]

- name: Setup Aldente (macOS Only)
  import_playbook: playbooks/aldente.yml
  tags: [aldente, app, macos, gui, utility]

# Streaming / Recording <-- Add OBS Here
- name: Setup OBS Studio
  import_playbook: playbooks/obs.yml
  tags: [obs, app, streaming, recording, multimedia, gui]

# Security / Password Management
- name: Setup Bitwarden
  import_playbook: playbooks/bitwarden.yml
  tags: [bitwarden, app, security, passwordmanager, gui]

# Shell Setup (Install zsh/bash, starship, set defaults)
- name: Configure Shell Environment
  import_playbook: playbooks/shell_setup.yml
  tags: [shell, config]
