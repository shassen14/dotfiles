# playbooks/spotify.yml: Installs Spotify music client.
- name: Install Spotify
  hosts: all
  become: true # Needed for Linux package installs/repo management
  gather_facts: true
  tags: [spotify, app, multimedia, gui]

  vars:
    # Current Spotify GPG Key URL (Verify periodically)
    spotify_gpg_key_url: "https://download.spotify.com/debian/pubkey_7A3A762FAFD4A51F.gpg"
    # Store the key in the standard keyrings directory
    spotify_keyring_path: "/usr/share/keyrings/spotify-archive-keyring.gpg"

  tasks:
    # --- macOS Task (remains the same) ---
    - name: Install Spotify via Homebrew Cask (macOS)
      become: false
      community.general.homebrew_cask:
        name: spotify
        state: present
      when: ansible_os_family == "Darwin"
      tags: [spotify, package, macos, homebrew]

    # --- Debian/Ubuntu (using official Apt Repository with signed-by) ---
    - name: Install prerequisites for managing apt repositories (Debian/Ubuntu)
      ansible.builtin.apt:
        # Ensure curl, gpg are present, and apt-transport-https (often default but good to ensure)
        name: [curl, gpg, apt-transport-https]
        state: present
        update_cache: true # Update cache BEFORE adding new sources/keys
      when: ansible_os_family == "Debian"
      tags: [spotify, package, debian, prerequisites]

    - name: Download Spotify GPG key and store in keyrings directory (Debian/Ubuntu)
      # Downloads key, converts from ascii armor to binary gpg, places in keyrings
      ansible.builtin.shell: >
        curl -fsSL {{ spotify_gpg_key_url }} |
        gpg --dearmor -o {{ spotify_keyring_path }}
      args:
        creates: "{{ spotify_keyring_path }}" # Makes task idempotent
      when: ansible_os_family == "Debian"
      tags: [spotify, package, debian, repo]

    - name: Ensure correct permissions for Spotify keyring file
      # Keyring file should be world-readable
      ansible.builtin.file:
        path: "{{ spotify_keyring_path }}"
        mode: '0644'
      when: ansible_os_family == "Debian"
      tags: [spotify, package, debian, repo]

    - name: Add Spotify Apt repository with signed-by (Debian/Ubuntu)
      ansible.builtin.apt_repository:
        # Reference the specific keyring using signed-by
        repo: "deb [signed-by={{ spotify_keyring_path }}] http://repository.spotify.com stable non-free"
        state: present
        filename: spotify # Creates /etc/apt/sources.list.d/spotify.list
        update_cache: true # Update cache AFTER adding the repo
      when: ansible_os_family == "Debian"
      tags: [spotify, package, debian, repo]

    - name: Install Spotify client package (Debian/Ubuntu)
      ansible.builtin.apt:
        name: spotify-client
        state: present
        # update_cache: false # Cache was updated in the previous step
      when: ansible_os_family == "Debian"
      tags: [spotify, package, debian, install]

    # --- Arch Linux Task (remains the same) ---
    - name: Install Spotify Launcher package (Arch)
      community.general.pacman:
        name: spotify-launcher
        state: present
      when: ansible_os_family == "Archlinux"
      tags: [spotify, package, arch]

    # --- Fedora/RedHat Family Task (remains the same) ---
    - name: Install Spotify via Snap (Fedora/RedHat)
      ansible.builtin.snap:
        name: spotify
        state: present
      when: ansible_os_family == "RedHat"
      tags: [spotify, package, fedora, redhat, snap]