# playbooks/spotify.yml: Installs Spotify music client.
- name: Install Spotify
  hosts: all
  become: true # Needed for Linux package installs/repo management
  gather_facts: true
  tags: [spotify, app, multimedia, gui]

  vars:
    # Try the key ID directly - often downloadable this way too
    spotify_key_id: "C85668DF69375001" # The key ID APT is actually looking for
    # Standard keyserver
    keyserver: "keyserver.ubuntu.com"
    # Store the key in the standard keyrings directory
    spotify_keyring_path: "/usr/share/keyrings/spotify-archive-keyring.gpg"

  tasks:
    # --- macOS Task (remains the same) ---
    - name: Install Spotify via Homebrew Cask (macOS)
      become: false
      community.general.homebrew_cask:
        name: spotify
        state: present
      when: ansible_os_family == "Darwin"
      tags: [spotify, package, macos, homebrew]

    # --- Debian/Ubuntu (using official Apt Repository with signed-by) ---
    - name: Install prerequisites for managing apt repositories (Debian/Ubuntu)
      ansible.builtin.apt:
        name: [curl, gpg, apt-transport-https, gnupg-utils] # Ensure gnupg-utils for gpg operations
        state: present
        update_cache: true # Update cache before starting repo/key ops
      when: ansible_os_family == "Debian"
      tags: [spotify, package, debian, prerequisites]

    - name: Add Spotify GPG key using direct key ID and dearmor
      # Fetch key by ID from keyserver, dearmor, write to keyring path
      ansible.builtin.shell: >
        gpg --no-default-keyring --keyring gnupg-ring:{{ spotify_keyring_path }}.gpg --keyserver {{ keyserver }} --recv-keys {{ spotify_key_id }} &&
        gpg --no-default-keyring --keyring gnupg-ring:{{ spotify_keyring_path }}.gpg --export {{ spotify_key_id }} |
        gpg --dearmor -o {{ spotify_keyring_path }} &&
        rm gnupg-ring:{{ spotify_keyring_path }}.gpg # Clean up temporary keyring if needed
      args:
        creates: "{{ spotify_keyring_path }}" # Makes task idempotent
      register: gpg_key_add_result
      changed_when: gpg_key_add_result.rc == 0 and not ansible_check_mode # Mark changed if successful
      failed_when: gpg_key_add_result.rc != 0
      when: ansible_os_family == "Debian"
      tags: [spotify, package, debian, repo]
      # Note: This is complex. If it fails, the curl method might be simpler IF the URL is correct.

    - name: Ensure correct permissions for Spotify keyring file
      ansible.builtin.file:
        path: "{{ spotify_keyring_path }}"
        mode: '0644' # Ensure world-readable
      when: ansible_os_family == "Debian"
      tags: [spotify, package, debian, repo]

    - name: Add Spotify Apt repository with signed-by
      ansible.builtin.apt_repository:
        repo: "deb [signed-by={{ spotify_keyring_path }}] http://repository.spotify.com stable non-free"
        state: present
        filename: spotify
        # update_cache: false # Do NOT update cache here yet
      when: ansible_os_family == "Debian"
      tags: [spotify, package, debian, repo]

    - name: Update apt cache AFTER adding repo and key
      # Explicitly update cache as a separate step after repo/key setup is complete
      ansible.builtin.apt:
        update_cache: true
      when: ansible_os_family == "Debian"
      tags: [spotify, package, debian, repo] # Tag as repo step

    - name: Install Spotify client package (Debian/Ubuntu)
      ansible.builtin.apt:
        name: spotify-client
        state: present
        # update_cache: false # Cache was just updated
      when: ansible_os_family == "Debian"
      tags: [spotify, package, debian, install]

    # --- Arch Linux Task (remains the same) ---
    - name: Install Spotify Launcher package (Arch)
      community.general.pacman:
        name: spotify-launcher
        state: present
      when: ansible_os_family == "Archlinux"
      tags: [spotify, package, arch]

    # --- Fedora/RedHat Family Task (remains the same) ---
    - name: Install Spotify via Snap (Fedora/RedHat)
      ansible.builtin.snap:
        name: spotify
        state: present
      when: ansible_os_family == "RedHat"
      tags: [spotify, package, fedora, redhat, snap]