# playbooks/docker.yml: Installs and configures Docker.
- hosts: all
  become: true # Most Docker setup tasks require root
  gather_facts: true

  tasks:
    # --- Debian/Ubuntu Setup ---
    - name: Install Docker prerequisites (Debian)
      ansible.builtin.apt:
        name: [apt-transport-https, ca-certificates, curl, gnupg, lsb-release]
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"
      tags: [docker, install, prerequisites, debian]

    - name: Add Docker GPG key (Debian)
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
        state: present
      when: ansible_os_family == "Debian"
      tags: [docker, install, repo, debian]

    - name: Add Docker repository (Debian)
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
        state: present
      when: ansible_os_family == "Debian"
      tags: [docker, install, repo, debian]

    - name: Install Docker CE packages (Debian)
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present # Use present instead of latest for more predictable state
        update_cache: true
      when: ansible_os_family == "Debian"
      tags: [docker, install, package, debian]

    # --- Fedora Setup (Using Official Repo) ---
    - name: Install Docker prerequisites (Fedora)
      ansible.builtin.dnf:
        name: [dnf-plugins-core]
        state: present
      when: ansible_distribution == "Fedora"
      tags: [docker, install, prerequisites, fedora]

    - name: Add Docker CE repository (Fedora)
      ansible.builtin.command:
        cmd: sudo dnf config-manager --add-repo https://download.docker.com/linux/fedora/docker-ce.repo
      args:
        creates: /etc/yum.repos.d/docker-ce.repo # Idempotency check
      when: ansible_distribution == "Fedora"
      tags: [docker, install, repo, fedora]

    - name: Install Docker CE packages (Fedora)
      ansible.builtin.dnf:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present
      when: ansible_distribution == "Fedora"
      tags: [docker, install, package, fedora]

    # --- Arch Linux Setup (Using Community Repo) ---
    - name: Install Docker package (Arch)
      community.general.pacman: # Use the specific pacman module
        name: [docker, docker-compose] # Install compose too
        state: present
      when: ansible_os_family == "Archlinux"
      tags: [docker, install, package, arch]

    # --- Linux Service Management ---
    - name: Ensure Docker service is started and enabled (Linux)
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
      when: ansible_os_family != "Darwin"
      tags: [docker, config, service]

    - name: Add target user to the docker group (Linux)
      ansible.builtin.user:
        name: "{{ target_user }}" # Use the variable defined in group_vars/all.yml
        groups: docker
        append: yes # Important: Append to existing groups
      when: ansible_os_family != "Darwin"
      tags: [docker, config, user]
      # Note: User needs to log out and back in for group change to take full effect.

    # --- macOS Setup ---
    - name: Cleanup Homebrew cache before Docker install (macOS)
      # Try to mitigate potential cache-related install issues
      become: false
      ansible.builtin.command:
        cmd: brew cleanup -s # -s scrubs old downloads and cache
      when: ansible_os_family == "Darwin"
      changed_when: false # Cleaning cache isn't a configuration change
      tags: [docker, prerequisites, macos] # Use prerequisites tag

    - name: Install Docker Desktop via Homebrew Cask (macOS)
      become: false # Homebrew runs as user
      community.general.homebrew_cask:
        name: docker
        state: present # Ensures Docker Desktop is installed or updated
      when: ansible_os_family == "Darwin"
      tags: [docker, install, package, macos]

    - name: Check if Docker.app exists after install (macOS)
      # Verify the application directory is actually present
      become: false
      ansible.builtin.stat:
        path: "/Applications/Docker.app"
      register: docker_app_stat
      when: ansible_os_family == "Darwin"
      tags: [docker, config, service, macos]

    - name: Ensure Docker Desktop application is started using path (macOS)
      # Use the absolute path which is more reliable immediately after install
      become: false
      ansible.builtin.command:
        cmd: open /Applications/Docker.app # <-- Use absolute path
      when:
        - ansible_os_family == "Darwin"
        - docker_app_stat.stat.exists # <-- Only run if the app exists
      changed_when: false # Opening an app isn't really a config change
      tags: [docker, config, service, macos]

    - name: List Docker contexts for debugging (macOS)
      # Helps verify the 'desktop-macos' context exists
      become: false
      ansible.builtin.command:
        cmd: docker context ls
      register: docker_context_ls_result
      changed_when: false # Listing isn't a change
      when: ansible_os_family == "Darwin"
      tags: [docker, config, service, debug] # Added debug tag
      ignore_errors: true # Don't fail if docker command isn't ready yet

    - name: Display Docker context list output
      ansible.builtin.debug:
        msg: "{{ docker_context_ls_result.stdout_lines | default([]) }}"
      when:
       - ansible_os_family == "Darwin"
       - docker_context_ls_result is defined
      tags: [docker, config, service, debug]

    - name: Wait for Docker daemon to be ready via Docker Desktop context (macOS)
      become: false
      ansible.builtin.command:
        cmd: docker info
      register: docker_check
      retries: 36
      delay: 5 
      until: docker_check.rc == 0
      changed_when: false
      ignore_errors: false
      # Explicitly set the Docker context for the command
      environment:
        DOCKER_CONTEXT: desktop-macos
      when: ansible_os_family == "Darwin" # Only apply context on macOS
      tags: [docker, config, service]

    - name: Wait for Docker daemon to be ready (Linux)
      # Separate task for Linux which doesn't need the context override
      become: false
      ansible.builtin.command:
        cmd: docker info
      register: docker_check_linux
      retries: 12 
      delay: 5
      until: docker_check_linux.rc == 0
      changed_when: false
      ignore_errors: false
      when: ansible_os_family != "Darwin"
      tags: [docker, config, service]