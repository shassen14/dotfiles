# playbooks/docker.yml: Installs and configures Docker.
- hosts: all
  become: true # Most Docker setup tasks require root
  gather_facts: true

  vars:
    # Define keyring path for consistency
    docker_keyring_path: "/etc/apt/keyrings/docker.asc"

  tasks:
    # --- Debian/Ubuntu Setup (Corrected Method) ---
    - name: Ensure dependent packages are installed (Debian)
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg]
        state: present
        update_cache: true # Update cache before installing deps
      when: ansible_os_family == "Debian"
      tags: [docker, install, prerequisites, debian]

    - name: Ensure /etc/apt/keyrings directory exists (Debian)
      ansible.builtin.file:
        path: "/etc/apt/keyrings"
        state: directory
        mode: '0755'
      when: ansible_os_family == "Debian"
      tags: [docker, install, repo, debian]

    - name: Download Docker GPG key (Debian)
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: "{{ docker_keyring_path }}"
        mode: '0644'
        force: true # Overwrite if exists to ensure latest key
      when: ansible_os_family == "Debian"
      tags: [docker, install, repo, debian]

    - name: Add Docker APT repository (Debian)
      ansible.builtin.apt_repository:
        # Correct format with signed-by
        repo: >
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by={{ docker_keyring_path }}]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker # Creates /etc/apt/sources.list.d/docker.list
        update_cache: false # We will update cache explicitly before install
      when: ansible_os_family == "Debian"
      register: docker_repo_added
      tags: [docker, install, repo, debian]

    # REMOVED the old 'apt_key' task which is deprecated

    - name: Update apt cache after adding repo if changed (Debian)
      ansible.builtin.apt:
        update_cache: true
      when:
        - ansible_os_family == "Debian"
        - docker_repo_added.changed # Only run if the repo task made changes
      tags: [docker, install, package, debian]

    - name: Install Docker CE packages (Debian)
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin] # Updated package names
        state: present
      when: ansible_os_family == "Debian"
      tags: [docker, install, package, debian]

    # --- Fedora Setup (Using Official Repo) ---
    # (Fedora tasks remain the same as the last working version)
    - name: Install Docker prerequisites (Fedora)
      ansible.builtin.dnf:
        name: [dnf-plugins-core]
        state: present
      when: ansible_distribution == "Fedora"
      tags: [docker, install, prerequisites, fedora]

    - name: Add Docker CE repository (Fedora)
      ansible.builtin.command:
        cmd: sudo dnf config-manager --add-repo https://download.docker.com/linux/fedora/docker-ce.repo
      args:
        creates: /etc/yum.repos.d/docker-ce.repo # Idempotency check
      when: ansible_distribution == "Fedora"
      tags: [docker, install, repo, fedora]

    - name: Install Docker CE packages (Fedora)
      ansible.builtin.dnf:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        state: present
      when: ansible_distribution == "Fedora"
      tags: [docker, install, package, fedora]

    # --- Arch Linux Setup (Using Community Repo) ---
    # (Arch tasks remain the same)
    - name: Install Docker package (Arch)
      community.general.pacman:
        name: [docker, docker-compose]
        state: present
      when: ansible_os_family == "Archlinux"
      tags: [docker, install, package, arch]

    # --- Linux Service Management ---
    # (These tasks remain the same)
    - name: Ensure Docker service is started and enabled (Linux)
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
      when: ansible_os_family != "Darwin"
      tags: [docker, config, service]

    - name: Add target user to the docker group (Linux)
      ansible.builtin.user:
        name: "{{ target_user }}"
        groups: docker
        append: yes
      when: ansible_os_family != "Darwin"
      tags: [docker, config, user]

    # --- macOS Setup ---
    # (These tasks remain the same as the last working version for macOS)
    - name: Cleanup Homebrew cache before Docker install (macOS)
      become: false
      ansible.builtin.command:
        cmd: brew cleanup -s
      when: ansible_os_family == "Darwin"
      changed_when: false
      tags: [docker, prerequisites, macos]

    - name: Install Docker Desktop via Homebrew Cask (macOS)
      become: false
      community.general.homebrew_cask:
        name: docker
        state: present
      when: ansible_os_family == "Darwin"
      tags: [docker, install, package, macos]

    - name: Check if Docker.app exists after install (macOS)
      become: false
      ansible.builtin.stat:
        path: "/Applications/Docker.app"
      register: docker_app_stat
      when: ansible_os_family == "Darwin"
      tags: [docker, config, service, macos]

    - name: Ensure Docker Desktop application is started using path (macOS)
      become: false
      ansible.builtin.command:
        cmd: open /Applications/Docker.app
      when:
        - ansible_os_family == "Darwin"
        - docker_app_stat.stat.exists
      changed_when: false
      tags: [docker, config, service, macos]

    # - name: Pause for Docker Desktop to potentially initialize (macOS)
    #   ansible.builtin.pause:
    #     seconds: 60 # Adjust pause time if needed
    #   when:
    #     - ansible_os_family == "Darwin"
    #     - lookup('env', 'CI') != 'true' # Only pause when not in CI (optional)
    #   tags: [docker, config, service, macos]

    # --- macOS Runtime Checks (SKIPPED IN CI) ---
    - name: Notice - Skipping Docker runtime checks in macOS CI environment
      ansible.builtin.debug:
        msg: "Skipping Docker context and daemon readiness checks because Docker Desktop initialization is unreliable in non-interactive macOS CI."
      when:
        - ansible_os_family == "Darwin"
        - lookup('env', 'CI') == 'true'
      tags: [docker, config, service, macos]

    - name: Check Docker contexts rigorously after pause (macOS, not in CI)
      become: false
      ansible.builtin.command:
        cmd: docker context ls
      register: docker_context_ls_result
      changed_when: false
      failed_when: docker_context_ls_result.rc != 0 or 'desktop-linux' not in docker_context_ls_result.stdout
      when:
        - ansible_os_family == "Darwin"
        - lookup('env', 'CI') != 'true' # Skip in CI
      tags: [docker, config, service, prerequisites, macos]

    - name: Display Docker context list output (macOS, not in CI)
      ansible.builtin.debug:
        msg: "{{ docker_context_ls_result.stdout_lines | default([]) }}"
      when:
        - ansible_os_family == "Darwin"
        - lookup('env', 'CI') != 'true' # Skip in CI
      tags: [docker, config, service, debug]

    - name: Wait for Docker context 'desktop-linux' to be resolvable (macOS, not in CI)
      become: false
      ansible.builtin.command:
        cmd: docker context inspect desktop-linux
      register: docker_context_check
      retries: 24
      delay: 5
      until: docker_context_check.rc == 0
      changed_when: false
      ignore_errors: false
      when:
        - ansible_os_family == "Darwin"
        - lookup('env', 'CI') != 'true' # Skip in CI
      tags: [docker, config, service]

    - name: Check Docker daemon readiness via context after context resolution (macOS, not in CI)
      become: false
      ansible.builtin.command:
        cmd: docker info
      environment:
        DOCKER_CONTEXT: desktop-linux
      changed_when: false
      when:
        - ansible_os_family == "Darwin"
        - lookup('env', 'CI') != 'true' # Skip in CI
      tags: [docker, config, service]

    # --- Linux Wait Task (Always runs on Linux) ---
    - name: Wait for Docker daemon to be ready (Linux)
      become: false
      ansible.builtin.command:
        cmd: docker info
      register: docker_check_linux
      retries: 15
      delay: 5
      until: docker_check_linux.rc == 0
      changed_when: false
      ignore_errors: false
      when: ansible_os_family != "Darwin"
      tags: [docker, config, service]