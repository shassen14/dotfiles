# playbooks/docker.yml: Installs and configures Docker.
- hosts: all
  become: true # Most Docker setup tasks require root
  gather_facts: true

  tasks:
    # --- Debian/Ubuntu Setup ---
    - name: Install Docker prerequisites (Debian)
      ansible.builtin.apt:
        name: [apt-transport-https, ca-certificates, curl, gnupg, lsb-release]
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"
      tags: [docker, install, prerequisites, debian]

    - name: Add Docker GPG key (Debian)
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
        state: present
      when: ansible_os_family == "Debian"
      tags: [docker, install, repo, debian]

    - name: Add Docker repository (Debian)
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
        state: present
      when: ansible_os_family == "Debian"
      tags: [docker, install, repo, debian]

    - name: Install Docker CE packages (Debian)
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present # Use present instead of latest for more predictable state
        update_cache: true
      when: ansible_os_family == "Debian"
      tags: [docker, install, package, debian]

    # --- Fedora Setup (Using Official Repo) ---
    - name: Install Docker prerequisites (Fedora)
      ansible.builtin.dnf:
        name: [dnf-plugins-core]
        state: present
      when: ansible_distribution == "Fedora"
      tags: [docker, install, prerequisites, fedora]

    - name: Add Docker CE repository (Fedora)
      ansible.builtin.command:
        cmd: sudo dnf config-manager --add-repo https://download.docker.com/linux/fedora/docker-ce.repo
      args:
        creates: /etc/yum.repos.d/docker-ce.repo # Idempotency check
      when: ansible_distribution == "Fedora"
      tags: [docker, install, repo, fedora]

    - name: Install Docker CE packages (Fedora)
      ansible.builtin.dnf:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present
      when: ansible_distribution == "Fedora"
      tags: [docker, install, package, fedora]

    # --- Arch Linux Setup (Using Community Repo) ---
    - name: Install Docker package (Arch)
      community.general.pacman: # Use the specific pacman module
        name: [docker, docker-compose] # Install compose too
        state: present
      when: ansible_os_family == "Archlinux"
      tags: [docker, install, package, arch]

    # --- Linux Service Management ---
    - name: Ensure Docker service is started and enabled (Linux)
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
      when: ansible_os_family != "Darwin"
      tags: [docker, config, service]

    - name: Add target user to the docker group (Linux)
      ansible.builtin.user:
        name: "{{ target_user }}" # Use the variable defined in group_vars/all.yml
        groups: docker
        append: yes # Important: Append to existing groups
      when: ansible_os_family != "Darwin"
      tags: [docker, config, user]
      # Note: User needs to log out and back in for group change to take full effect.

    # --- macOS Setup ---
    - name: Install Docker Desktop via Homebrew Cask (macOS)
      become: false # Homebrew runs as user
      community.general.homebrew_cask:
        name: docker
        state: present # Ensures Docker Desktop is installed or updated
      when: ansible_os_family == "Darwin"
      tags: [docker, install, package, macos]

    - name: Ensure Docker Desktop application is started (macOS)
      # This just opens the app if closed, doesn't guarantee daemon readiness
      become: false
      ansible.builtin.command:
        cmd: open -a Docker
      when: ansible_os_family == "Darwin"
      changed_when: false # Opening an app isn't really a config change
      tags: [docker, config, service, macos]

    - name: Wait for Docker daemon to be ready (macOS and Linux)
      # This checks if the 'docker info' command succeeds
      become: false # Docker client command runs as user (assuming group membership on Linux)
      ansible.builtin.command:
        cmd: docker info
      register: docker_check
      retries: 12 # ~1 minute total wait
      delay: 5 # Wait 5 seconds between retries
      until: docker_check.rc == 0
      changed_when: false # Checking status isn't a change
      ignore_errors: false # Fail the playbook if Docker doesn't become ready
      tags: [docker, config, service]