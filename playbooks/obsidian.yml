# playbooks/obsidian.yml: Installs Obsidian note-taking app.
- name: Install Obsidian on supported platforms
  hosts: all
  become: true # Default to become for package installs, override where needed
  gather_facts: true

  vars:
    # Define temporary download paths
    obsidian_deb_path: "/tmp/obsidian_{{ ansible_architecture }}.deb"
    obsidian_rpm_path: "/tmp/obsidian_{{ ansible_architecture }}.rpm"
    # Adjust if Obsidian provides arch-specific RPMs, otherwise use generic name
    # obsidian_rpm_path: "/tmp/obsidian.x86_64.rpm"

  tasks:
    # --- macOS ---
    - name: Check if Obsidian.app exists (macOS)
      become: false
      ansible.builtin.stat:
        path: "/Applications/Obsidian.app"
      register: obsidian_app_stat
      when: ansible_os_family == "Darwin"
      tags: [obsidian, gui, package, macos]

    - name: Install Obsidian on macOS using Homebrew Cask (only if not found)
      become: false # Homebrew cask runs as user
      community.general.homebrew_cask:
        name: obsidian
        state: present
      when:
        - ansible_os_family == "Darwin"
        - not obsidian_app_stat.stat.exists # <-- Only run if stat check shows it doesn't exist
      tags: [obsidian, gui, package, macos]

    # --- Debian ---
    - name: Download Obsidian .deb package (Debian)
      ansible.builtin.get_url:
        # Fetch latest URL dynamically if possible, or update manually. Pinned version example:
        # url: "https://github.com/obsidianmd/obsidian-releases/releases/download/v1.5.3/obsidian_1.5.3_amd64.deb"
        url: "https://github.com/obsidianmd/obsidian-releases/releases/latest/download/obsidian_{{ ansible_architecture }}.deb"
        dest: "{{ obsidian_deb_path }}"
        mode: '0644'
      when: ansible_os_family == "Debian"
      tags: [obsidian, gui, package, debian, download]

    - name: Install Obsidian from .deb package (Debian)
      ansible.builtin.apt:
        deb: "{{ obsidian_deb_path }}"
      when: ansible_os_family == "Debian"
      tags: [obsidian, gui, package, debian, install]

    # --- RedHat ---
    # Note: Obsidian doesn't seem to provide official RPMs directly. AppImage or Flatpak might be better.
    # Assuming a hypothetical RPM download for demonstration.
    # - name: Download Obsidian .rpm package (RedHat)
    #   ansible.builtin.get_url:
    #     url: "URL_TO_OBSIDIAN_RPM" # Replace with actual URL if available
    #     dest: "{{ obsidian_rpm_path }}"
    #     mode: '0644'
    #   when: ansible_os_family == "RedHat"
    #   tags: [obsidian, gui, package, redhat, download]
    #
    # - name: Install Obsidian from .rpm package (RedHat)
    #   ansible.builtin.dnf:
    #     name: "{{ obsidian_rpm_path }}"
    #     state: present
    #     disable_gpg_check: true # If the RPM isn't signed or key isn't imported
    #   when: ansible_os_family == "RedHat"
    #   tags: [obsidian, gui, package, redhat, install]
    - name: Notify about manual Obsidian install on RedHat
      ansible.builtin.debug:
        msg: "Obsidian RPMs are not officially provided. Please install manually via AppImage, Flatpak, or other means on {{ ansible_distribution }}."
      when: ansible_os_family == "RedHat"
      tags: [obsidian, gui, package, redhat]


    # --- Arch Linux (AUR) ---
    # Prerequisites for building AUR packages (like yay)
    - name: Install base-devel and git (Arch AUR prerequisites)
      community.general.pacman:
        name: ['base-devel', 'git']
        state: present
      when: ansible_os_family == "Archlinux"
      tags: [obsidian, aur, prerequisites, arch]

    # Install yay AUR helper if not present
    - name: Check if yay is installed
      ansible.builtin.command: "which yay"
      register: yay_check
      ignore_errors: true
      changed_when: false
      when: ansible_os_family == "Archlinux"
      tags: [obsidian, aur, prerequisites, arch]

    - name: Clone yay repository
      become: false # Run git clone as the target user
      ansible.builtin.git:
        repo: 'https://aur.archlinux.org/yay.git'
        dest: "/tmp/yay" # Clone to a temporary directory
      when:
        - ansible_os_family == "Archlinux"
        - yay_check.rc != 0 # Only clone if yay is not found
      tags: [obsidian, aur, prerequisites, arch]

    - name: Build and install yay
      become: false # makepkg should run as user
      ansible.builtin.command:
        # Run makepkg; -s installs deps, -i installs package, --noconfirm skips prompts
        cmd: "makepkg -si --noconfirm"
      args:
        chdir: "/tmp/yay" # Run in the cloned directory
        creates: "/usr/bin/yay" # Idempotency check
      when:
        - ansible_os_family == "Archlinux"
        - yay_check.rc != 0 # Only build/install if yay was not found
      tags: [obsidian, aur, prerequisites, arch]

    - name: Install Obsidian from AUR using yay
      become: false # yay runs as user but may prompt for sudo password internally
      ansible.builtin.command:
        cmd: "yay -S --noconfirm obsidian" # Use yay to install
      args:
        creates: "/usr/bin/obsidian" # Idempotency check
      when: ansible_os_family == "Archlinux"
      tags: [obsidian, gui, package, aur, arch, install]
      # Note: This assumes yay can handle sudo password prompt if needed,
      # or passwordless sudo is configured for pacman.

    # --- Cleanup ---
    - name: Clean up downloaded packages (.deb, .rpm)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ obsidian_deb_path }}"
        # - "{{ obsidian_rpm_path }}" # Uncomment if using RPM download
      when: item is defined and (ansible_os_family == "Debian" or ansible_os_family == "RedHat")
      tags: [obsidian, cleanup]

    - name: Clean up yay build directory
      ansible.builtin.file:
        path: "/tmp/yay"
        state: absent
      when: ansible_os_family == "Archlinux"
      tags: [obsidian, cleanup, aur]