---
# playbooks/dev_prerequisites.yml
# Installs common and foundational development prerequisites including language toolchains.

- name: Install Foundational Development Prerequisites and Language Toolchains
  hosts: all
  become: true # Most package installations need sudo
  gather_facts: true # For ansible_os_family, ansible_distribution, ansible_user_id etc.
  tags: [always, prerequisites, dev, coreutils, buildtools, languages, nodejs, python, rust, cpp]

  vars:
    # Node.js version to install via NodeSource (for Debian/Ubuntu)
    nodejs_version_nodesource: "22.x" # Choose a recent LTS

    nodesource_ubuntu_codename: "{{ ansible_distribution_release | lower }}"

    # User for whom rustup will be installed (non-root)
    # ansible_user_id is usually the user running the ansible command (if not using remote_user)
    # or the user logged into the target machine for local connections.
    target_user: "{{ ansible_env.USER | default(ansible_user_id) | default(lookup('env', 'USER')) }}"

  tasks:
    # -------------------------------------------------------------------------
    # 0. PRE-FLIGHT: Update Package Cache (especially for apt)
    # -------------------------------------------------------------------------
    - name: Update apt cache (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: yes
      when: ansible_os_family == "Debian"
      changed_when: false # Don't mark as changed for just an update

    # -------------------------------------------------------------------------
    # 1. CORE UTILITIES
    # -------------------------------------------------------------------------
    - name: Install core utilities (git, curl, wget, unzip, jq) - Linux
      ansible.builtin.package: # Generic module, works for apt, dnf, pacman
        name:
          - git
          - curl
          - wget # Useful for downloads
          - unzip
          - jq   # Useful for JSON processing, e.g., API calls in scripts
        state: present
      when: ansible_os_family != "Darwin"
      tags: [coreutils]

    - name: Install core utilities (git, curl, wget, jq) - macOS via Homebrew
      become: false
      community.general.homebrew:
        name:
          - git
          - curl
          - wget
          - jq
          # unzip is usually pre-installed on macOS or handled by Archive Utility
        state: present
      when: ansible_os_family == "Darwin"
      tags: [coreutils]

    # -------------------------------------------------------------------------
    # 2. BUILD TOOLCHAINS & C/C++ COMPILERS
    # -------------------------------------------------------------------------
    - name: Install common build tools (make, cmake, pkg-config) - Linux
      ansible.builtin.package:
        name:
          - make
          - cmake
          - pkg-config
        state: present
      when: ansible_os_family != "Darwin"
      tags: [buildtools, cpp]

    - name: Install build-essential (Debian/Ubuntu - includes gcc/g++)
      ansible.builtin.apt:
        name: build-essential
        state: present
      when: ansible_os_family == "Debian"
      tags: [buildtools, cpp]

    - name: Install Development Tools group (RedHat family - includes gcc/g++)
      ansible.builtin.dnf:
        name: "@Development Tools" # Group install
        state: present
      when: ansible_os_family == "RedHat"
      tags: [buildtools, cpp]

    - name: Install base-devel group (Arch Linux - includes gcc/g++, make)
      community.general.pacman:
        name: base-devel
        state: present
      when: ansible_os_family == "Archlinux"
      tags: [buildtools, cpp]

    - name: Ensure common build tools (cmake, pkg-config) - macOS via Homebrew
      become: false
      community.general.homebrew:
        name:
          - cmake
          - pkg-config
        state: present
      when: ansible_os_family == "Darwin"
      tags: [buildtools, cpp]
      # Note: Xcode Command Line Tools (gcc/clang, make) are a separate, larger install on macOS.
      # Usually triggered by user or first use of a tool needing them.
      # Can attempt to trigger with: ansible.builtin.command: xcode-select --install
      # but it's interactive. Assume user handles this or it's already present.

    # -------------------------------------------------------------------------
    # 3. NODE.JS and NPM
    # -------------------------------------------------------------------------
    - name: Install prerequisites for NodeSource repository (Debian/Ubuntu)
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg]
        state: present
      when: ansible_os_family == "Debian"
      tags: [nodejs]

    - name: Create keyrings directory for NodeSource (Debian/Ubuntu)
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      when: ansible_os_family == "Debian"
      tags: [nodejs]

    - name: Add NodeSource GPG key (Debian/Ubuntu)
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: "/etc/apt/keyrings/nodesource.gpg"
        mode: '0644'
      when: ansible_os_family == "Debian"
      tags: [nodejs]

    # - name: Add NodeSource repository for Node.js {{ nodejs_version_nodesource }} (Debian/Ubuntu)
    #   ansible.builtin.apt_repository:
    #     repo: "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/no_{{ nodejs_version_nodesource }} {{ nodesource_ubuntu_codename }} main"
    #     state: present
    #     filename: nodesource
    #   when: ansible_os_family == "Debian"
    #   tags: [nodejs, repo, debian, ubuntu]

    - name: Fetch and run NodeSource setup script for Node.js {{ nodejs_version_nodesource }} (Debian/Ubuntu)
      become: true
      ansible.builtin.shell:
        cmd: "curl -sL https://deb.nodesource.com/setup_{{ nodejs_version_nodesource }} | bash -"
      args:
        creates: /etc/apt/sources.list.d/nodesource.list
      when: ansible_os_family == "Debian"
      tags: [nodejs, repo, debian, ubuntu]
      # Add a changed_when if the script doesn't always create the file
      # but you want to detect if it did something. However, 'creates' handles idempotency.
      changed_when: false # Let 'creates' handle idempotency; assume script makes changes if it runs.
                         # Or, register output and check if it indicates changes.

    - name: Install Node.js and npm from NodeSource (Debian/Ubuntu)
      ansible.builtin.apt:
        name: nodejs # This package from NodeSource includes npm
        state: present
      when: ansible_os_family == "Debian"
      tags: [nodejs]

    - name: Install Node.js and npm (RedHat family)
      ansible.builtin.dnf:
        name: nodejs # Or specific stream like 'nodejs:20/common'
        state: present
      when: ansible_os_family == "RedHat"
      tags: [nodejs]

    - name: Install Node.js and npm (Arch Linux)
      community.general.pacman:
        name: [nodejs, npm]
        state: present
      when: ansible_os_family == "Archlinux"
      tags: [nodejs]

    - name: Install Node.js (includes npm) via Homebrew (macOS)
      become: false
      community.general.homebrew:
        name: node
        state: present
      when: ansible_os_family == "Darwin"
      tags: [nodejs]

    # -------------------------------------------------------------------------
    # 4. PYTHON, PIP, and VENV
    # -------------------------------------------------------------------------
    - name: Install Python3, pip, and venv (Debian/Ubuntu)
      ansible.builtin.apt:
        name: [python3, python3-pip, python3-venv]
        state: present
      when: ansible_os_family == "Debian"
      tags: [python]

    - name: Install Python3, pip (RedHat family)
      ansible.builtin.dnf:
        name: [python3, python3-pip] # python3-virtualenv if preferred
        state: present
      when: ansible_os_family == "RedHat"
      tags: [python]

    - name: Install Python, pip, and venv (Arch Linux)
      community.general.pacman:
        name: [python, python-pip, python-virtualenv] # Arch uses python-virtualenv for venv functionality
        state: present
      when: ansible_os_family == "Archlinux"
      tags: [python]

    - name: Ensure Python 3 is available (macOS)
      # Python 3 is typically pre-installed with Xcode Command Line Tools.
      # Homebrew can manage it more explicitly if desired:
      # community.general.homebrew:
      #   name: python@3.11 # Or your preferred version
      #   state: present
      # For pip, it's usually available with system Python 3 or Homebrew Python.
      # This task just verifies python3 exists, assuming pip comes with it.
      ansible.builtin.command: "python3 --version"
      register: python3_check_mac
      changed_when: false
      failed_when: python3_check_mac.rc != 0
      when: ansible_os_family == "Darwin"
      tags: [python]
      ignore_errors: true # Don't fail playbook if Python3 isn't immediately obvious; user might have custom setup

    # -------------------------------------------------------------------------
    # 5. RUST TOOLCHAIN (via rustup)
    # -------------------------------------------------------------------------
    - name: Check if rustup is already installed
      # Check for the rustup binary in the default cargo bin location
      ansible.builtin.stat:
        path: "{{ lookup('env', 'HOME') }}/.cargo/bin/rustup"
      register: rustup_check
      tags: [always] # Ensure check always runs if tag is specified

    - name: Install rustup (if not already installed)
      # Runs the official rustup-init script non-interactively
      ansible.builtin.shell:
        # -y: Assume yes, proceed without confirmation
        # --no-modify-path: IMPORTANT - prevents script from trying to change shell rc files
        # We manage PATH explicitly via Chezmoi templates later.
        cmd: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
        # warn: false # <-- This line was removed to fix compatibility error
      args:
        # 'creates:' makes the task skip if rustup exists, preventing 'changed' state falsely
        # If rustup binary exists, this task will not run the 'cmd'.
        creates: "{{ lookup('env', 'HOME') }}/.cargo/bin/rustup"
      # Run only if the stat check showed rustup doesn't exist
      when: not rustup_check.stat.exists
      register: rustup_install_result
      # If the command runs (because 'creates:' condition was false),
      # and it succeeds (rc=0), then consider state changed.
      changed_when: rustup_install_result.rc == 0
      failed_when: rustup_install_result.rc != 0
      # No become needed here as it's set at the play level

    - name: Display Rustup Install Result (Debug)
      ansible.builtin.debug:
        msg: |
          Rustup Install STDOUT:
          {{ rustup_install_result.stdout | default('N/A - Task Skipped or No Output') }}
          Rustup Install STDERR:
          {{ rustup_install_result.stderr | default('N/A - Task Skipped or No Output') }}
      # Run this debug task only if the install task actually ran
      when: rustup_install_result is defined and not rustup_install_result.skipped | default(false)
      tags: [debug] # Optional debug tag


    - name: Install i3status-rust using cargo for user '{{ target_user }}'
      become: false
      become_user: "{{ target_user }}" # Assuming target_user is defined
      ansible.builtin.command:
        cmd: "{{ '/home/' + target_user + '/.cargo/bin/' }}cargo install i3status-rust"
      args:
        creates: "{{ '/home/' + target_user + '/.cargo/bin/' }}i3status-rust"
      environment:
        PATH: "{{ '/home/' + target_user + '/.cargo/bin:' + ansible_env.PATH }}"
      when: ansible_os_family == "Debian" # Or wherever you need it
      tags: [i3, i3status_rust, package]

    # -------------------------------------------------------------------------
    # X. (Optional) OTHER LANGUAGES - Example: Go
    # -------------------------------------------------------------------------
    # - name: Install Go Language (Linux - package)
    #   ansible.builtin.package:
    #     name: golang # Or golang-go on some distros
    #     state: present
    #   when: ansible_os_family != "Darwin"
    #   tags: [go, languages]
    #
    # - name: Install Go Language (macOS - Homebrew)
    #   become: false
    #   community.general.homebrew:
    #     name: go
    #     state: present
    #   when: ansible_os_family == "Darwin"
    #   tags: [go, languages]

    # Ensure GOPATH/GOBIN are set up by your shell configuration (e.g., via Chezmoi)
    # Example: mkdir -p "{{ ansible_env.HOME }}/go/{bin,pkg,src}"

    # End of playbook
