# playbooks/shell_setup.yml: Installs shells (zsh, bash), tools (starship),
#                           and Zsh history plugin on all systems.
#                           Sets OS-specific default shells.
- name: Install Shells, Tools, and Zsh Plugins
  hosts: all
  become: true # Default for package installs / user module
  gather_facts: true
  tags: [shell, config, prerequisites]

  tasks:
    # --- Install Zsh (Ensure on Both OSes) ---
    - name: Install zsh via Homebrew (macOS)
      community.general.homebrew:
        name: zsh
        state: present
      become: false # MUST run brew as user
      when: ansible_os_family == "Darwin"
      tags: [shell, zsh, package, macos, homebrew]

    - name: Install zsh via Package (Linux)
      ansible.builtin.package:
        name: zsh
        state: present
      when: ansible_os_family != "Darwin"
      tags: [shell, zsh, package, linux]
      # Inherits become: true

    # --- Install Bash (Ensure on Both OSes) ---
    - name: Install bash via Homebrew (macOS)
      community.general.homebrew:
        name: bash
        state: present
      become: false
      when: ansible_os_family == "Darwin"
      tags: [shell, bash, package, macos, homebrew]

    - name: Ensure bash is present via Package (Linux)
      ansible.builtin.package:
        name: bash
        state: present
      when: ansible_os_family != "Darwin"
      tags: [shell, bash, package, linux]
      # Inherits become: true

    # --- Install Shared Shell Tools ---
    - name: Install bash-completion (Linux Only, for Bash default)
      ansible.builtin.package:
        name: bash-completion
        state: present
      when: ansible_os_family != "Darwin"
      tags: [shell, bash, completion, package, linux]
      # Inherits become: true

    - name: Install Starship prompt via Homebrew (macOS)
      community.general.homebrew:
        name: starship
        state: present
      become: false
      when: ansible_os_family == "Darwin"
      tags: [shell, starship, package, macos, homebrew]

    - name: Install Starship prompt via official script (Linux)
      ansible.builtin.shell:
        cmd: curl -fsSL https://starship.rs/install.sh | sh -s -- -y
      args:
        creates: /usr/local/bin/starship
      become: true
      when: ansible_os_family != "Darwin"
      register: starship_install_script_result
      changed_when: "'Installed Starship' in starship_install_script_result.stdout | default('')" # Check default needed
      failed_when: starship_install_script_result.rc != 0
      tags: [shell, starship, package, linux]

    # --- Ensure Git is Installed (OS Specific) ---
    - name: Ensure Git is installed via Homebrew (macOS prerequisite for plugin clone)
      community.general.homebrew:
        name: git
        state: present
      become: false # MUST run brew as user
      when: ansible_os_family == "Darwin"
      tags: [shell, git, plugins, prerequisites, macos, homebrew]

    - name: Ensure Git is installed via Package (Linux prerequisite for plugin clone)
      ansible.builtin.package:
        name: git
        state: present
      when: ansible_os_family != "Darwin"
      tags: [shell, git, plugins, prerequisites, linux]
      # Inherits become: true correctly for apt/dnf etc.

    # --- Install Zsh History Substring Search Plugin (Both OSes) ---
    - name: Create Zsh plugins directory (All OSes - Run as User Explicitly)
      # ... (this task remains the same, with become: false, delegate_to, lookup) ...
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.zsh/plugins"
        state: directory
        mode: '0755'
      become: false
      delegate_to: localhost
      tags: [shell, zsh, plugins, config]

    - name: Clone zsh-history-substring-search plugin (All OSes - Run as User Explicitly)
      ansible.builtin.git:
        repo: 'https://github.com/zsh-users/zsh-history-substring-search.git'
        dest: "{{ lookup('env', 'HOME') }}/.zsh/plugins/zsh-history-substring-search"
        depth: 1 # Keep shallow clone
        version: master # Keep desired version
        update: yes # Default: ensures it fetches updates on subsequent runs
      become: false # Ensure this runs as the user
      delegate_to: localhost # Ensure execution context is user
      # REMOVED the entire 'args:' block below this line
      # args:
      #   creates: "{{ lookup('env', 'HOME') }}/.zsh/plugins/zsh-history-substring-search/.git"
      tags: [shell, zsh, plugins, package]



    # --- Set Default Shell (Remains the same - OS specific) ---
    - name: Set default shell to zsh for user (macOS)
      ansible.builtin.user:
        name: "{{ target_user }}" # Define this variable (e.g., in group_vars/all.yml)
        shell: /bin/zsh # Verify this path on macOS if needed
      when: ansible_os_family == "Darwin"
      tags: [shell, zsh, config, macos]
      # Inherits become: true

    - name: Set default shell to bash for user (Linux/Ubuntu)
      ansible.builtin.user:
        name: "{{ target_user }}"
        shell: /bin/bash
      when: ansible_os_family != "Darwin"
      tags: [shell, bash, config, linux]
      # Inherits become: true