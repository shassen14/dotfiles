# playbooks/alacritty_source_build.yml: Clones, builds, and installs Alacritty from source on Linux.
- name: Build and Install Alacritty from Source (Linux)
  hosts: all
  # Most installation steps require root, but build runs as user.
  # Default to become=true, but override for specific tasks.
  become: true
  gather_facts: true
  tags: [alacritty, terminal, tools, gui, sourcebuild] # Add sourcebuild tag

  vars:
    alacritty_repo_url: "https://github.com/alacritty/alacritty.git"
    # Clone destination within the user's home directory
    alacritty_repo_dest: "{{ lookup('env', 'HOME') }}/src/alacritty" # Example: ~/src/alacritty
    # Where the final binary will be placed
    alacritty_binary_dest: "/usr/local/bin/alacritty"
    # Where the compiled binary is located after build
    alacritty_compiled_binary: "{{ alacritty_repo_dest }}/target/release/alacritty"
    # User running the playbook (needed for become: false tasks)
    ansible_user_id: "{{ lookup('env', 'USER') }}" # Or use target_user variable

  tasks:
    # --- Stage 1: Prerequisites ---
    - name: Ensure base build dependencies are installed (git, python, build tools)
      ansible.builtin.package:
        name:
          - git
          - python3
          - cmake
          - pkg-config
          - build-essential # Installs g++, make, etc. on Debian/Ubuntu
        state: present
      # Become=true inherited

    - name: Install Alacritty specific build dependencies (Debian/Ubuntu)
      ansible.builtin.package:
        name:
          - libfreetype6-dev
          - libfontconfig1-dev
          - libxcb-xfixes0-dev
          - libxkbcommon-dev
        state: present
      when: ansible_os_family == "Debian"
      # Become=true inherited

    # Add similar dependency blocks here for Fedora, Arch etc. using their package names
    # Example Fedora:
    # - name: Install Alacritty specific build dependencies (Fedora/RedHat)
    #   ansible.builtin.dnf:
    #     name: [freetype-devel, fontconfig-devel, libxcb-devel, libxkbcommon-devel, gcc-c++]
    #     state: present
    #   when: ansible_os_family == "RedHat"

    - name: Ensure Rust is installed (relies on rust.yml having run)
      ansible.builtin.command:
        cmd: "{{ lookup('env', 'HOME') }}/.cargo/bin/rustc --version"
      changed_when: false
      become: false # Rust installed in user's home
      delegate_to: localhost # Run as user

    # --- Stage 2: Clone Source Code ---
    - name: Create source code directory if needed
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/src"
        state: directory
        mode: '0755'
      become: false # Create in user home

    - name: Clone Alacritty repository
      ansible.builtin.git:
        repo: "{{ alacritty_repo_url }}"
        dest: "{{ alacritty_repo_dest }}"
        version: master # Or pin to a specific release tag like 'v0.13.2'
        depth: 1 # Optional: shallow clone
      become: false # Clone as user into user's home dir

    # --- Stage 3: Build ---
    - name: Build Alacritty binary using Cargo
      ansible.builtin.command:
        # Use the cargo executable installed by rustup
        cmd: "{{ lookup('env', 'HOME') }}/.cargo/bin/cargo build --release"
        chdir: "{{ alacritty_repo_dest }}" # Run command inside the repo directory
        # Idempotency: Run only if the target binary doesn't exist yet
        creates: "{{ alacritty_compiled_binary }}"
      become: false # Build runs as the user
      register: build_result
      changed_when: build_result.rc == 0 and not ansible_check_mode # Assume change if build runs ok
      failed_when: build_result.rc != 0
      environment: # Ensure PATH includes cargo bin for dependencies cargo might use
        PATH: "{{ lookup('env', 'HOME') }}/.cargo/bin:{{ ansible_env.PATH }}"

    - name: Display Build Result (Debug)
      ansible.builtin.debug:
        var: build_result
      when: build_result is defined and build_result.changed | default(false)
      tags: [debug]

    # --- Stage 4: Post Build Installation ---

    # 4.1 Terminfo (CRUCIAL for Tmux)
    - name: Ensure tic command (terminfo compiler) is available
      ansible.builtin.package:
        name: "{{ 'ncurses-bin' if ansible_os_family == 'Debian' else 'ncurses' }}"
        state: present
      # become: true inherited

    - name: Compile and install Alacritty terminfo definition
      ansible.builtin.command:
        # Path is relative to the build directory (alacritty_repo_dest)
        cmd: "tic -xe alacritty,alacritty-direct {{ alacritty_repo_dest }}/extra/alacritty.info"
        # Check system path for idempotency
        creates: "/usr/share/terminfo/a/alacritty"
      # become: true inherited (needs sudo to write system-wide)
      when: build_result.rc == 0 # Only run if build succeeded

    # 4.2 Install Binary
    - name: Copy Alacritty binary to /usr/local/bin
      ansible.builtin.copy:
        src: "{{ alacritty_compiled_binary }}"
        dest: "{{ alacritty_binary_dest }}"
        mode: '0755' # Make executable
        remote_src: yes # src is on the remote machine
      # become: true inherited
      when: build_result.rc == 0

    # 4.3 Desktop Entry
    - name: Copy Alacritty SVG icon
      ansible.builtin.copy:
        src: "{{ alacritty_repo_dest }}/extra/logo/alacritty-term.svg"
        dest: "/usr/share/pixmaps/Alacritty.svg"
        mode: '0644'
        remote_src: yes
      # become: true inherited
      when: build_result.rc == 0

    - name: Install Alacritty Desktop file
      ansible.builtin.command:
        cmd: desktop-file-install {{ alacritty_repo_dest }}/extra/linux/Alacritty.desktop
        creates: /usr/share/applications/Alacritty.desktop
      # become: true inherited
      when: build_result.rc == 0
      changed_when: true # Assume change if command runs

    - name: Update Desktop database
      ansible.builtin.command:
        cmd: update-desktop-database
      # become: true inherited
      when: build_result.rc == 0
      changed_when: false # Updating database isn't a config state change

    # 4.4 Manual Page (Optional - Requires scdoc, gzip)
    - name: Install Man Page dependencies (scdoc, gzip)
      ansible.builtin.package:
        name: [scdoc, gzip]
        state: present
      # become: true inherited

    - name: Create Man Page directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /usr/local/share/man/man1
        - /usr/local/share/man/man5
      # become: true inherited

    - name: Generate and install Alacritty man pages (man1)
      ansible.builtin.shell: # Use shell for the pipe
        cmd: "scdoc < {{ alacritty_repo_dest }}/extra/man/{{ item }}.1.scd | gzip -c > /usr/local/share/man/man1/{{ item }}.1.gz"
        creates: "/usr/local/share/man/man1/{{ item }}.1.gz"
      loop:
        - alacritty
        - alacritty-msg
      # become: true inherited
      when: build_result.rc == 0
      changed_when: true

    - name: Generate and install Alacritty man pages (man5)
      ansible.builtin.shell: # Use shell for the pipe
        cmd: "scdoc < {{ alacritty_repo_dest }}/extra/man/{{ item }}.5.scd | gzip -c > /usr/local/share/man/man5/{{ item }}.5.gz"
        creates: "/usr/local/share/man/man5/{{ item }}.5.gz"
      loop:
        - alacritty
        - alacritty-bindings
      # become: true inherited
      when: build_result.rc == 0
      changed_when: true

    # 4.5 Shell Completions (Copy to user home)
    - name: Create user Zsh functions directory for completions
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.zsh_functions" # Common location
        state: directory
        mode: '0755'
      become: false # User directory

    - name: Copy Zsh completion file
      ansible.builtin.copy:
        src: "{{ alacritty_repo_dest }}/extra/completions/_alacritty"
        dest: "{{ lookup('env', 'HOME') }}/.zsh_functions/_alacritty"
        mode: '0644'
        remote_src: yes
      become: false # Copy as user

    - name: Create user Bash completion directory
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.bash_completion.d" # Common location
        state: directory
        mode: '0755'
      become: false

    - name: Copy Bash completion file
      ansible.builtin.copy:
        src: "{{ alacritty_repo_dest }}/extra/completions/alacritty.bash"
        dest: "{{ lookup('env', 'HOME') }}/.bash_completion.d/alacritty"
        mode: '0644'
        remote_src: yes
      become: false