# playbooks/discord.yml: Installs Discord communication platform.
- name: Install Discord
  hosts: all
  become: true # Needed for Linux package installs
  gather_facts: true
  tags: [discord, app, communication, gui]

  tasks:
    # --- macOS ---
    - name: Install Discord via Homebrew Cask (macOS)
      become: false # Homebrew Cask runs as user
      community.general.homebrew_cask:
        name: discord
        state: present
      when: ansible_os_family == "Darwin"
      tags: [discord, package, macos, homebrew]

    # --- Debian/Ubuntu (using official .deb) ---
    - name: Download Discord .deb package (Debian/Ubuntu)
      become: false # Download can happen as user to /tmp
      ansible.builtin.get_url:
        url: "https://discord.com/api/download?platform=linux&format=deb"
        dest: "/tmp/discord-latest.deb"
        mode: '0644'
      when: ansible_os_family == "Debian"
      tags: [discord, package, debian, download]

    - name: Install Discord from .deb package (Debian/Ubuntu)
      # become: true # Already set at playbook level
      ansible.builtin.apt:
        deb: "/tmp/discord-latest.deb"
        state: present
      when: ansible_os_family == "Debian"
      tags: [discord, package, debian, install]

    - name: Clean up Discord .deb package (Debian/Ubuntu)
      become: false # Cleanup can happen as user if permissions allow
      ansible.builtin.file:
        path: "/tmp/discord-latest.deb"
        state: absent
      when: ansible_os_family == "Debian"
      tags: [discord, package, debian, cleanup]

    # --- Arch Linux (using official repository) ---
    - name: Install Discord package (Arch)
      # become: true # Already set at playbook level
      community.general.pacman:
        name: discord
        state: present
      when: ansible_os_family == "Archlinux"
      tags: [discord, package, arch]

    # --- Fedora/RedHat Family (using Snap as fallback) ---
    # Note: Assumes snapd service is installed and running.
    # You might need another playbook to ensure snapd is set up.
    - name: Install Discord via Snap (Fedora/RedHat)
      # become: true # Already set at playbook level
      ansible.builtin.snap:
        name: discord
        state: present
      when: ansible_os_family == "RedHat" # Covers Fedora, CentOS Stream, etc.
      tags: [discord, package, fedora, redhat, snap]