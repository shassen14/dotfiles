---
# playbooks/brave.yml
# Installs Brave Browser on supported platforms.

- name: Install Brave Browser
  hosts: all
  become: true # Most package/repo tasks need sudo
  gather_facts: true # For ansible_os_family and ansible_distribution
  tags: [brave, browser, app, gui, internet] # Add relevant tags

  tasks:
    # --- Debian/Ubuntu ---
    - name: Install prerequisites for Brave Browser repository (Debian/Ubuntu)
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - curl
          - gnupg # For managing GPG keys if not already present
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"
      tags: [brave, prerequisites, debian, ubuntu]

    - name: Add Brave Browser GPG key (Debian/Ubuntu)
      ansible.builtin.get_url: # More idempotent than shell curl | gpg --dearmor
        url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
        dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg
        mode: "0644"
      when: ansible_os_family == "Debian"
      tags: [brave, repo, debian, ubuntu]

    - name: Add Brave Browser repository (Debian/Ubuntu)
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg arch=amd64] https://brave-browser-apt-release.s3.brave.com/ stable main"
        state: present
        filename: brave-browser-release # Specify filename
      when: ansible_os_family == "Debian"
      tags: [brave, repo, debian, ubuntu]

    - name: Install Brave Browser package (Debian/Ubuntu)
      ansible.builtin.apt:
        name: brave-browser
        state: present
        update_cache: yes # Update cache after adding new repo
      when: ansible_os_family == "Debian"
      tags: [brave, package, debian, ubuntu]

    # --- RedHat/Fedora/Rocky/Alma ---
    - name: Add Brave Browser GPG key (RedHat family)
      ansible.builtin.rpm_key:
        state: present
        key: https://brave-browser-rpm-release.s3.brave.com/brave-core.asc # Key for RPMs
      when: ansible_os_family == "RedHat" # Covers Fedora, CentOS, RHEL, Rocky, Alma
      tags: [brave, repo, redhat, fedora]

    - name: Add Brave Browser repository (RedHat family)
      ansible.builtin.yum_repository:
        name: brave-browser
        description: Brave Browser
        baseurl: "https://brave-browser-rpm-release.s3.brave.com/{% if ansible_distribution == 'Fedora' %}fedora/{% else %}x86_64/{% endif %}" # Fedora has a specific path
        enabled: true
        gpgcheck: true
        gpgkey: https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
        # For Fedora, the path structure might be different, often including $releasever
        # Example for Fedora specifically if the above generic one fails:
        # baseurl: "https://brave-browser-rpm-release.s3.brave.com/fedora/$releasever/$basearch/"
      when: ansible_os_family == "RedHat"
      tags: [brave, repo, redhat, fedora]

    - name: Install Brave Browser package (RedHat family)
      ansible.builtin.dnf:
        name: brave-browser
        state: present
        # enablerepo: brave-browser # Not usually needed if repo is enabled correctly
      when: ansible_os_family == "RedHat"
      tags: [brave, package, redhat, fedora]

    # --- Arch Linux ---
    # Brave is available in the AUR or sometimes community repo.
    # Assuming yay is installed (as per your obsidian.yml)
    - name: Install Brave Browser from AUR using yay (Arch Linux)
      become: false # yay runs as user but may prompt for sudo password internally
      ansible.builtin.command:
        cmd: "yay -S --noconfirm brave-bin" # 'brave-bin' is typically the official binary
      args:
        creates: "/usr/bin/brave" # Idempotency check
      when: ansible_os_family == "Archlinux"
      tags: [brave, package, aur, arch]
      # Note: This assumes yay can handle sudo password prompt if needed,
      # or passwordless sudo is configured for pacman.

    # --- macOS ---
    - name: Install Brave Browser using Homebrew Cask (macOS)
      become: false # Homebrew runs as user
      community.general.homebrew_cask:
        name: brave-browser
        state: present # Ensures installed and allows updates via brew upgrade
      when: ansible_os_family == "Darwin"
      tags: [brave, package, macos]
