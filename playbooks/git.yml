# playbooks/git.yml: Installs Git and GitHub CLI.
- name: Install Git and GitHub CLI
  hosts: all
  become: true # Package installs usually need sudo
  gather_facts: true

  tasks:
    - name: Update apt cache before installing Git/gh (with retries)
      become: true
      ansible.builtin.apt:
        update_cache: yes
      retries: 3 # Number of retries
      delay: 10  # Seconds between retries
      register: apt_update_status
      until: apt_update_status is succeeded # Retry until success
      when: ansible_os_family == "Debian"
      tags: [git, prerequisites, debian] # Add prerequisites tag

    - name: Install Git and gh on Debian/Ubuntu
      become: true
      ansible.builtin.apt:
        name:
          - git
          - gh
        state: present
        # update_cache: true # Set to false OR remove, as we updated explicitly before
        update_cache: false
      when: ansible_os_family == "Debian"
      tags: [git, tools, package, debian]

    - name: Install Git and gh on RedHat/CentOS/Fedora
      ansible.builtin.dnf:
        name: [git, gh]
        state: present
      when: ansible_os_family == "RedHat"
      tags: [git, tools, package, fedora, redhat]

    - name: Install Git and gh on Arch Linux
      community.general.pacman:
        name: [git, github-cli] # Package name is github-cli on Arch
        state: present
      when: ansible_os_family == "Archlinux"
      tags: [git, tools, package, arch]

    - name: Install Git via Homebrew (macOS)
      become: false
      community.general.homebrew:
        name: git
        state: present
      when: ansible_os_family == "Darwin"
      tags: [git, tools, package, macos]

    - name: Install gh CLI via Homebrew (macOS)
      become: false
      community.general.homebrew:
        name: gh
        state: present
      when: ansible_os_family == "Darwin"
      tags: [git, tools, package, macos]