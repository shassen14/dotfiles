---
# playbooks/gimp.yml
# Installs GIMP (GNU Image Manipulation Program).

- name: Install GIMP
  hosts: all
  become: true # For Linux package installs
  gather_facts: true # For ansible_os_family
  tags: [gimp, graphics, photo, editing, gui, app]

  tasks:
    # --- Debian/Ubuntu ---
    - name: Install GIMP (Debian/Ubuntu)
      ansible.builtin.apt:
        name: gimp
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"
      tags: [gimp, package, debian, ubuntu]

    # --- RedHat Family (Fedora, CentOS Stream, RHEL, Rocky, Alma) ---
    - name: Install GIMP (RedHat family)
      ansible.builtin.dnf:
        name: gimp
        state: present
      when: ansible_os_family == "RedHat"
      tags: [gimp, package, redhat, fedora]

    # --- Arch Linux ---
    - name: Install GIMP (Arch Linux)
      community.general.pacman:
        name: gimp
        state: present
      when: ansible_os_family == "Archlinux"
      tags: [gimp, package, arch]

    # --- macOS ---
    - name: Install GIMP using Homebrew Cask (macOS)
      become: false # Homebrew Cask runs as user
      community.general.homebrew_cask:
        name: gimp
        state: present
      when: ansible_os_family == "Darwin"
      tags: [gimp, package, macos]

    - name: GIMP installation summary
      ansible.builtin.debug:
        msg: "GIMP installation attempted. Check task status for details."
      tags: [gimp, info]