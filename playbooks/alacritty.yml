# playbooks/alacritty.yml: Installs Alacritty Terminal Emulator using Homebrew Cask (macOS ONLY).
- name: Install Alacritty via Homebrew (macOS)
  hosts: all # Play targets all, but tasks inside are filtered by 'when'
  become: false # Default to false for Homebrew tasks
  gather_facts: true # Still useful for ansible_os_family
  # Ensure this playbook ONLY runs on macOS via the import condition in main playbook.yml
  # No top-level 'when' needed here.
  tags: [alacritty, terminal, tools, gui, macos] # Add macos tag

  tasks:
    # --- macOS Installation via Homebrew Cask ---
    - name: Install Alacritty via Homebrew Cask (macOS)
      community.general.homebrew_cask:
        name: alacritty
        state: present
      # become: false is inherited from play level
      when: ansible_os_family == "Darwin" # Keep internal check for safety/clarity
      tags: [alacritty, package, macos]