---
# playbooks/i3wm.yml
# Installs i3 Window Manager and common companion utilities on Debian/Ubuntu.

- name: Install i3 Window Manager and Utilities
  hosts: all # This playbook will be conditionally imported
  become: true # Package installation requires sudo
  gather_facts: true # For ansible_os_family
  tags: [i3, i3wm, wm, desktop, gui] # Add relevant tags

  vars:
    i3_companion_packages:
      - i3lock # Screen locker
      - i3status # Status bar generator
      - suckless-tools # Provides dmenu (default application launcher for i3)
      - feh # Lightweight image viewer, often used for setting wallpapers
      - rofi # A more versatile application launcher (alternative to dmenu)
      - arandr # GUI for XRandR (managing screen layouts)
      - lxappearance # To set GTK themes, icons, fonts
      - pavucontrol # PulseAudio volume control GUI
      - network-manager-gnome # Network management applet (if not using a more minimal network setup)
      # Compositor for transparency, shadows, fading (choose one or none)
      # - compton       # Older, well-known compositor
      - picom # A popular compton fork, often preferred now
      # Add any other tools you commonly use with i3:
      # - scrot         # Screenshot utility
      - flameshot # More advanced screenshot utility
      - dunst # Notification daemon
      - libnotify-bin # For sending notifications (used by dunst or other notifiers)
      - pulseaudio-utils
      - playerctl # For media key control in status bar
      - light
      - fonts-font-awesome # For icons (or nerd-fonts handled elsewhere)
      # - xautolock     # For automatically locking the screen

  tasks:
    # This playbook is intended for Debian/Ubuntu. Other OSes would need different tasks.
    - name: Fail if not on Debian/Ubuntu (as this playbook is specific)
      ansible.builtin.fail:
        msg: "This i3wm installation playbook is designed for Debian/Ubuntu (ansible_os_family == 'Debian'). Current OS family: {{ ansible_os_family }}"
      when: ansible_os_family != "Debian"
      # If you intend to add Arch/Fedora support later, you'd remove/adjust this.

    - name: Install i3 Window Manager package (Debian/Ubuntu)
      ansible.builtin.apt:
        name: i3 # This meta-package usually pulls in i3-wm, i3lock, i3status
        state: present
        update_cache: yes # Good to update cache before installing
      tags: [i3, package]

    - name: Install i3 companion packages (Debian/Ubuntu)
      ansible.builtin.apt:
        name: "{{ i3_companion_packages }}"
        state: present
        install_recommends: yes # Install recommended packages for these utilities
      tags: [i3, package, utilities]

    - name: Inform user about selecting i3 at login
      ansible.builtin.debug:
        msg: |
          i3 Window Manager and companion utilities have been installed.
          To use i3, you will need to select it from your display manager
          (login screen, e.g., GDM, LightDM) when you log in next.
          Default i3 config is at ~/.config/i3/config.
          Use Chezmoi to manage your custom i3 configuration.
      tags: [i3, info]

    - name: Add user to video group (for 'light' brightness control)
      ansible.builtin.user:
        name: "{{ lookup('env', 'USER') }}" # Use the user running the playbook
        groups: video
        append: yes # Important: Add to existing groups
      become: true
      when: ansible_os_family != "Darwin"
      register: user_group_change
      tags: [i3, prerequisites, permissions, brightness]

    - name: Ensure user systemd directory exists for user '{{ lookup('env', 'USER') }}'
      # This task MUST run as the user themselves OR as root.
      # If running as user (play become: false, task become: false), it's fine.
      # If running as root (play become: true, task become: true), it's fine.
      # If running as root but trying to 'become: false', path resolution can fail.
      # Let's assume play has become: true and make this task run as root to *create* the dir,
      # but ensure ownership is correct.
      ansible.builtin.file:
        path: "/home/{{ lookup('env', 'USER') }}/.config/systemd/user" # Explicit absolute path
        state: directory
        mode: "0750" # User read/write/execute, group read/execute
        owner: "{{ lookup('env', 'USER') }}" # Ensure correct owner
        group: "{{ lookup('env', 'USER') }}" # Ensure correct group (or lookup primary group if needed)
      become: true # Run this task as root to ensure directory creation works robustly
      tags: [i3, systemd, user_service, prerequisites]

    - name: Enable the i3lock-resume user systemd service for user '{{ lookup('env', 'USER') }}'
      # This task MUST run as the target user to interact with their systemd --user instance.
      ansible.builtin.systemd:
        name: i3lock-resume.service
        enabled: yes
        scope: user # IMPORTANT: Specifies this is a user service
      become: true # Elevate to root...
      become_user: "{{ lookup('env', 'USER') }}" # ...then run systemctl --user as the target user
      tags: [i3, systemd, user_service]
      environment: # Pass necessary environment for systemctl --user connection
        XDG_RUNTIME_DIR: "/run/user/{{ lookup('pipe', 'id -u ' + lookup('env', 'USER')) }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ lookup('pipe', 'id -u ' + lookup('env', 'USER')) }}/bus"
      # Note: Passing XDG_RUNTIME_DIR and DBUS_SESSION_BUS_ADDRESS is often required
      # when using become_user to interact with the user's systemd instance/session bus.
