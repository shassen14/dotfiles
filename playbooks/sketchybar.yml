---
# playbooks/sketchybar.yml
# Installs SketchyBar and common dependencies for macOS.

- name: Install SketchyBar and Dependencies (macOS Only)
  hosts: all # This playbook will be conditionally imported
  # become: false # Homebrew tasks will handle their own become state
  gather_facts: true # For ansible_os_family
  tags: [sketchybar, macos, gui, statusbar, ui]

  tasks:
    - name: Fail if not on macOS
      ansible.builtin.fail:
        msg: "SketchyBar can only be installed on macOS (ansible_os_family == 'Darwin'). Current OS family: {{ ansible_os_family }}"
      when: ansible_os_family != "Darwin"

    # --- TAP anselmn/sketchybar (Official Tap for SketchyBar) ---
    # The official tap for sketchybar is anselmn/sketchybar as per their GitHub.
    # FelixKratz is the author but the brew tap is often under anselmn for sketchybar itself.
    # Let's use the most commonly cited tap: anselmn/sketchybar (or check FelixKratz's own if preferred)
    # UPDATE: Based on sketchybar's official docs, it's `FelixKratz/formulae`
    - name: Tap FelixKratz/formulae for SketchyBar (macOS)
      become: false # Homebrew tap runs as user
      community.general.homebrew_tap:
        name: FelixKratz/formulae # This is the correct tap name
        state: present # Ensures the tap is added
      when: ansible_os_family == "Darwin"
      tags: [sketchybar, prerequisites, macos, homebrew]

    - name: Install SketchyBar and common dependencies using Homebrew (macOS)
      become: false # Homebrew runs as user
      community.general.homebrew:
        name:
          - felixkratz/formulae/sketchybar # SketchyBar itself from its tap
          - jq # For parsing JSON, often used in SketchyBar scripts
          - switchaudio-osx # For controlling audio input/output (SwitchAudioSource)
          - font-hack-nerd-font # A good Nerd Font for icons (or use your preferred one)
          # - sf-symbols                 # If you want to use SF Symbols (macOS native symbols)
        state: present
        update_homebrew: yes # Good to ensure taps are up-to-date before installing from them
      when: ansible_os_family == "Darwin"
      tags: [sketchybar, package, macos, homebrew]

    - name: Tap homebrew-ffmpeg for potentially needed audio/video components by some widgets
      become: false
      community.general.homebrew_tap:
        tap: homebrew-ffmpeg/ffmpeg
        state: present
      when: ansible_os_family == "Darwin"
      tags: [sketchybar, prerequisites, macos, homebrew]
      ignore_errors: true # In case the tap already exists or has issues, don't fail all

    - name: Inform user about SketchyBar setup
      ansible.builtin.debug:
        msg: |
          SketchyBar has been installed via Homebrew.
          To start using SketchyBar:
          1. Ensure its configuration file exists at: ~/.config/sketchybar/sketchybarrc
             (You will manage this with Chezmoi).
          2. You may need to grant SketchyBar Accessibility permissions if certain features require it:
             System Settings > Privacy & Security > Accessibility
          3. SketchyBar is typically started as a service. You can add it to Login Items
             or use 'brew services start sketchybar'.
          4. Refer to SketchyBar documentation and examples for configuration.
      when: ansible_os_family == "Darwin"
      tags: [sketchybar, info]
