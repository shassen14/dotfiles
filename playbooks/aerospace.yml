---
# playbooks/aerospace.yml
# Installs AeroSpace tiling window manager for macOS.

- name: Install AeroSpace Tiling Window Manager (macOS Only)
  hosts: all
  gather_facts: true # For ansible_os_family
  tags: [aerospace, wm, macos, gui, tiling]

  tasks:
    - name: Fail if not on macOS
      ansible.builtin.fail:
        msg: "AeroSpace can only be installed on macOS (ansible_os_family == 'Darwin'). Current OS family: {{ ansible_os_family }}"
      when: ansible_os_family != "Darwin"

    - name: Ensure Homebrew is available (debug/sanity check)
      ansible.builtin.command: "brew --version"
      register: brew_version_check
      changed_when: false
      failed_when: brew_version_check.rc != 0
      when: ansible_os_family == "Darwin"
      tags: [aerospace, prerequisites, macos, homebrew]

    - name: Tap the nikitabobko/tap repository for AeroSpace (macOS)
      become: false # Homebrew commands run as user
      community.general.homebrew_tap:
        name: nikitabobko/tap # The tap to add
        state: present # Ensures the tap is present
      when: ansible_os_family == "Darwin"
      tags: [aerospace, homebrew_tap, macos]

    - name: Install AeroSpace using Homebrew (macOS)
      become: false # Homebrew runs as user
      community.general.homebrew:
        # Now that the tap is ensured, you can often just use the formula name directly,
        # or keep the fully qualified name. Homebrew should find it.
        name: aerospace # Or keep nikitabobko/tap/aerospace, but 'aerospace' should now work
        state: present
      when: ansible_os_family == "Darwin"
      tags: [aerospace, package, macos, homebrew]

    - name: Inform user about AeroSpace setup
      ansible.builtin.debug:
        msg: |
          AeroSpace has been installed via Homebrew.
          To start using AeroSpace:
          1. Open the AeroSpace application from your Applications folder or via Spotlight.
          2. It will likely request Accessibility and Screen Recording permissions. GRANT THESE.
             - Accessibility: System Settings > Privacy & Security > Accessibility
             - Screen Recording: System Settings > Privacy & Security > Screen Recording
          3. The default configuration file is at: ~/.aerospace.toml
          4. Use Chezmoi to manage your custom AeroSpace configuration.
          5. You can start AeroSpace on login via System Settings > General > Login Items.
      when: ansible_os_family == "Darwin"
      tags: [aerospace, info]
