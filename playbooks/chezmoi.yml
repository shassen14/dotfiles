---
# playbooks/chezmoi.yml: Installs Chezmoi, initializes repo, and applies changes.
- hosts: all
  gather_facts: true # For ansible_env, ansible_os_family, ansible_user
  # Default 'become: false' for the play. Tasks will specify 'become' if needed.

  vars:
    # --- User and Path Definitions ---
    # Determine if running in CI.
    # Check if 'CI' key exists in ansible_env and if its value is 'true'. Default to false.
    running_in_ci: "{{ ansible_env.CI is defined and ansible_env.CI == 'true' }}"

    target_chezmoi_user: "{{ lookup('env', 'USER') if not running_in_ci else ansible_user | default('runner') }}"
    target_chezmoi_home: "{{ ansible_env.HOME }}"

    # --- Chezmoi Configuration ---
    chezmoi_repo_url: "https://github.com/shassen14/dotfiles.git"
    chezmoi_branch: "main"

    # --- CI Specific Configuration ---
    # GITHUB_WORKSPACE is only reliably set in GitHub Actions CI
    github_workspace_path: "{{ ansible_env.GITHUB_WORKSPACE if ansible_env.GITHUB_WORKSPACE is defined else '' }}"

    chezmoi_ci_config_in_repo: "{{ github_workspace_path }}/chezmoi.ci.toml"
    chezmoi_target_config_file_path: "{{ target_chezmoi_home }}/.config/chezmoi/chezmoi.toml"

    ansible_chezmoi_config_for_apply: "{% if running_in_ci %}{{ chezmoi_ci_config_in_repo }}{% else %}{{ chezmoi_target_config_file_path }}{% endif %}"

    dotfiles_repo_root_for_chezmoi_env: "{% if running_in_ci and github_workspace_path != '' %}{{ github_workspace_path }}{% else %}{{ target_chezmoi_home }}/dotfiles{% endif %}"

  tasks:
    # --- 0. DEBUG: Display Key Variables ---
    - name: "DEBUG: Key variables for Chezmoi setup"
      ansible.builtin.debug:
        msg:
          - "Running in CI (running_in_ci): {{ running_in_ci }}" # Debug the new variable
          - "Target Chezmoi User: {{ target_chezmoi_user }}"
          - "Target Chezmoi Home: {{ target_chezmoi_home }}"
          - "Target Chezmoi Config Path: {{ chezmoi_target_config_file_path }}"
          - "Effective Config for Apply: {{ ansible_chezmoi_config_for_apply }}"
          - "GITHUB_WORKSPACE path (github_workspace_path): {{ github_workspace_path }}"
          - "DOTFILES_REPO_ROOT env var for Chezmoi templates: {{ dotfiles_repo_root_for_chezmoi_env }}"
      tags: [always, chezmoi, debug]

    # --- 1. Prerequisites (Git, Curl) ---
    - name: Ensure git and curl are installed (Linux)
      become: true
      ansible.builtin.package:
        name: [git, curl]
        state: present
      when: ansible_os_family != "Darwin"
      tags: [always, chezmoi, prerequisites]

    - name: Ensure git and curl are installed (macOS via Homebrew)
      community.general.homebrew:
        name: [git, curl]
        state: present
      when: ansible_os_family == "Darwin"
      tags: [always, chezmoi, prerequisites]

    # --- 2. Chezmoi Installation ---
    - name: Install chezmoi via script (Linux)
      become: true # Install to /usr/local/bin needs sudo
      ansible.builtin.shell: # Use shell for the pipe
        cmd: 'sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin'
      args:
        creates: /usr/local/bin/chezmoi # Idempotency
      when: ansible_os_family != "Darwin"
      tags: [always, chezmoi, install]

    - name: Ensure chezmoi via Homebrew (macOS)
      community.general.homebrew:
        name: chezmoi
        state: present
      when: ansible_os_family == "Darwin"
      tags: [always, chezmoi, install]

    # --- 3. Chezmoi Initialization (Clone/Setup Source Repo) ---
    - name: Check if Chezmoi's internal source directory git repo exists
      become: true # To allow become_user to work correctly
      become_user: "{{ target_chezmoi_user }}"
      ansible.builtin.stat:
        path: "{{ target_chezmoi_home }}/.local/share/chezmoi/.git"
      register: chezmoi_internal_source_git_check
      tags: [always, chezmoi, init]

    - name: Determine 'chezmoi init' source argumentqq
      ansible.builtin.set_fact:
        chezmoi_init_source_or_repo: "{% if running_in_ci and github_workspace_path != '' %}--source={{ github_workspace_path }}{% else %}{{ chezmoi_repo_url }}{% endif %}"
      tags: [always, chezmoi, init]

    - name: Initialize Chezmoi with dotfiles repository (if internal source doesn't exist or in CI with local source)
      become: true
      become_user: "{{ target_chezmoi_user }}"
      ansible.builtin.shell:
        cmd: "chezmoi init {{ chezmoi_init_source_or_repo }} --branch={{ chezmoi_branch }} --apply=false -v"
      args:
        chdir: "{{ target_chezmoi_home }}"
        creates: "{{ target_chezmoi_home }}/.local/share/chezmoi/.git"
      when: not chezmoi_internal_source_git_check.stat.exists or (running_in_ci and github_workspace_path != '')
      register: chezmoi_init_result
      changed_when: "'Cloned' in chezmoi_init_result.stdout or 'Initialized' in chezmoi_init_result.stdout or 'Updated' in chezmoi_init_result.stdout"
      tags: [always, chezmoi, init]

    - name: Display Chezmoi Init Result (Debug)
      ansible.builtin.debug:
        var: chezmoi_init_result
      when: chezmoi_init_result is defined and chezmoi_init_result.changed | default(false)
      tags: [always, chezmoi, init, debug]

    # --- 4. Chezmoi Apply ---
    # This task applies the dotfiles.
    # In CI, it uses 'chezmoi.ci.toml' (from repo root) which provides necessary data.
    # This run will create '~/.config/chezmoi/chezmoi.toml' from your template.
    # Locally, for subsequent runs, it uses the existing '~/.config/chezmoi/chezmoi.toml'.
    # For a very first local run, if '~/.config/chezmoi/chezmoi.toml' doesn't exist,
    # it might use defaults or the CI config path if you adjust the condition in ansible_chezmoi_config_for_apply.
    # This setup prioritizes CI correctness.
    - name: "Apply Chezmoi changes (using config: {{ ansible_chezmoi_config_for_apply }})"
      become: true
      become_user: "{{ target_chezmoi_user }}"
      ansible.builtin.command:
        cmd: >-
          chezmoi apply
          --config {{ ansible_chezmoi_config_for_apply }}
          {% if running_in_ci and github_workspace_path != '' %}
          --source {{ github_workspace_path }}/home
          --destination {{ target_chezmoi_home }}
          {% endif %}
          --force
          -v
      args:
        chdir: "{{ target_chezmoi_home }}"
      environment:
        USER: "{{ target_chezmoi_user }}"
        # This DOTFILES_REPO_ROOT is for your private_dot_config/chezmoi/chezmoi.toml.tmpl
        DOTFILES_REPO_ROOT: "{{ dotfiles_repo_root_for_chezmoi_env }}" # Use the new variable
      register: chezmoi_apply_result
      # More robust change detection: check for "Applied" or if stdout has multiple lines (diffs)
      changed_when: "'Applied' in chezmoi_apply_result.stdout or (chezmoi_apply_result.stdout | default('')).splitlines() | length > 1"
      tags: [always, chezmoi, apply]

    - name: Display Chezmoi Apply Result (Debug)
      ansible.builtin.debug:
        msg: |
          Chezmoi Apply STDOUT:
          {{ chezmoi_apply_result.stdout | default('N/A') }}
          Chezmoi Apply STDERR:
          {{ chezmoi_apply_result.stderr | default('N/A') }}
          Chezmoi Apply RC: {{ chezmoi_apply_result.rc | default('N/A') }}
      when: chezmoi_apply_result is defined # Always show for debugging apply step
      tags: [always, chezmoi, apply, debug]
