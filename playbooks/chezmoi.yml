---
# playbooks/chezmoi.yml: Installs Chezmoi and applies changes.
# Assumes 'chezmoi init --apply <your_repo_url>' has been run manually for the first time
# on a new machine to set up ~/.local/share/chezmoi and ~/.config/chezmoi/chezmoi.toml.
- hosts: all
  gather_facts: true

  vars:
    target_chezmoi_user: "{{ lookup('env', 'USER') }}" # For local runs, this is you
    target_chezmoi_home: "{{ ansible_env.HOME }}"
    # This is where 'chezmoi init <URL>' would have cloned your repo
    chezmoi_internal_data_path: "{{ target_chezmoi_home }}/.local/share/chezmoi"

  tasks:
    - name: "DEBUG: Key local variables"
      ansible.builtin.debug:
        msg:
          - "Target User: {{ target_chezmoi_user }}"
          - "Target Home: {{ target_chezmoi_home }}"
          - "Chezmoi Internal Data Path: {{ chezmoi_internal_data_path }}"
      tags: [always, chezmoi, debug]

    # --- 1. Prerequisites (Git, Curl) ---
    - name: Ensure git and curl are installed (Linux)
      become: true
      ansible.builtin.package: { name: "git,curl", state: present }
      when: ansible_os_family != "Darwin"
      tags: [always, chezmoi, prerequisites]

    - name: Ensure git and curl are installed (macOS via Homebrew)
      community.general.homebrew: { name: ["git", "curl"], state: present }
      when: ansible_os_family == "Darwin"
      tags: [always, chezmoi, prerequisites]

    # --- 2. Chezmoi Installation ---
    - name: Install chezmoi via script (Linux)
      become: true
      ansible.builtin.shell: { cmd: 'sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin', args: { creates: /usr/local/bin/chezmoi } }
      when: ansible_os_family != "Darwin"
      tags: [always, chezmoi, install]

    - name: Install chezmoi via Homebrew (macOS)
      community.general.homebrew: { name: chezmoi, state: present }
      when: ansible_os_family == "Darwin"
      tags: [always, chezmoi, install]

    # --- 3. Verify Chezmoi Initialization (Informational) ---
    - name: "Check if Chezmoi's internal source data directory exists"
      become: true # For become_user
      become_user: "{{ target_chezmoi_user }}"
      ansible.builtin.stat:
        path: "{{ chezmoi_internal_data_path }}/.git" # Check for .git
      register: chezmoi_internal_git_check_result
      tags: [always, chezmoi, init_check]

    - name: "FAIL if Chezmoi not initialized"
      ansible.builtin.fail:
        msg: |
          Chezmoi source directory {{ chezmoi_internal_data_path }} does not appear to be initialized.
          On a new machine, please run 'chezmoi init --apply {{ chezmoi_remote_repo_url | default('YOUR_REPO_URL') }}' manually first,
          after installing git, curl, and chezmoi itself (which this playbook can do if run partially with --tags install).
      when: not chezmoi_internal_git_check_result.stat.exists
      tags: [always, chezmoi, init_check]

    # --- 4. Chezmoi Apply ---
    # This task now assumes ~/.config/chezmoi/chezmoi.toml exists and is correctly configured
    # (because 'chezmoi init --apply <URL>' would have created it from your template).
    - name: "Apply Chezmoi changes for '{{ target_chezmoi_user }}'"
      become: true
      become_user: "{{ target_chezmoi_user }}"
      ansible.builtin.command:
        cmd: "chezmoi apply --force -v" # Reads config from ~/.config/chezmoi/chezmoi.toml
      args:
        chdir: "{{ target_chezmoi_home }}"
      environment:
        USER: "{{ target_chezmoi_user }}"
        # DOTFILES_REPO_ROOT is NOT STRICTLY needed by chezmoi.toml.tmpl anymore if its sourceDir is hardcoded
        # BUT if any OTHER template uses {{ env "DOTFILES_REPO_ROOT" }}, you still need it.
        # Or, your chezmoi.toml.tmpl could use:
        # sourceDir = "{{ .chezmoi.homeDir }}/.local/share/chezmoi/home" (most robust)
        # For safety, let's assume some template might still want it, pointing to the internal store
        DOTFILES_REPO_ROOT: "{{ target_chezmoi_home }}/.local/share/chezmoi"
        # You can also pass CHEZMOI_FULL_NAME, CHEZMOI_EMAIL etc. here if you want Ansible
        # to override the defaults during its 'chezmoi apply' run.
      register: chezmoi_apply_result
      changed_when: "'Applied' in chezmoi_apply_result.stdout or (chezmoi_apply_result.stdout | default('')).splitlines() | length > 1"
      tags: [always, chezmoi, apply]

    - name: "DEBUG: Chezmoi Apply Result"
      ansible.builtin.debug: { var: chezmoi_apply_result }
      when: chezmoi_apply_result is defined
      tags: [always, chezmoi, apply, debug]