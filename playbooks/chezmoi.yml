# playbooks/chezmoi.yml: Installs Chezmoi, handles non-interactive login via BW API Key, initializes repo, and applies changes.
# Assumes essential prerequisites (git, curl) & Bitwarden CLI (bw) are installed by prior playbooks/bootstrap.
# Assumes BW_CLIENTID & BW_CLIENTSECRET are available via GitHub Secrets (in CI) OR
# Ansible Vault variables bw_client_id & bw_client_secret are defined (for local runs).
- hosts: all
  gather_facts: true # Need ansible_env.HOME, ansible_os_family etc.

  tasks:
    # --- Ensure Chezmoi Binary Exists ---
    - name: Ensure chezmoi via script (Linux)
      become: true
      ansible.builtin.shell:
        cmd: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
      args:
        creates: /usr/local/bin/chezmoi
      when: ansible_os_family != "Darwin"
      tags: [always, chezmoi, install]

    - name: Ensure chezmoi via Homebrew (macOS)
      become: false
      community.general.homebrew:
        name: chezmoi
        state: present
      when: ansible_os_family == "Darwin"
      tags: [always, chezmoi, install]

    # --- Check Initial State ---
    - name: Check if chezmoi internal repository cache exists (.git dir)
      become: false
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.local/share/chezmoi/.git"
      register: chezmoi_internal_repo_git_check
      tags: [always, chezmoi, config]

    - name: Check if chezmoi target configuration file exists (before any init/apply)
      become: false
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.config/chezmoi/chezmoi.toml"
      register: chezmoi_target_config_check_before_run
      tags: [always, chezmoi, config]

    # --- Chezmoi Initialization ---
    - name: Initialize chezmoi (clone repository only, if needed)
      become: false
      ansible.builtin.command:
        cmd: "chezmoi init --verbose --branch {{ chezmoi_branch }} {{ chezmoi_repo }}"
      args:
        chdir: "{{ ansible_env.HOME }}"
        creates: "{{ ansible_env.HOME }}/.local/share/chezmoi/.git"
      when: not chezmoi_internal_repo_git_check.stat.exists
      register: chezmoi_init_result
      tags: [always, chezmoi, config, init]

    - name: Display Init Result (Debug)
      ansible.builtin.debug:
        var: chezmoi_init_result
      when: chezmoi_init_result is defined and chezmoi_init_result.changed
      tags: [always, chezmoi, config, init, debug]

    # --- Explicit Verification AFTER Init Attempt ---
    - name: Verify 'home' subdirectory exists in cache after init attempt
      become: false
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.local/share/chezmoi/home"
      register: internal_cache_home_dir_check
      tags: [always, chezmoi, config, verify]

    - name: Fail if internal cache 'home' structure is missing
      ansible.builtin.fail:
        msg: |
          Chezmoi 'home' subdirectory not found in internal cache ({{ ansible_env.HOME }}/.local/share/chezmoi/home)
          after initialization attempt. Check Git repo structure.
          Init command rc: {{ chezmoi_init_result.rc | default('N/A - Init Skipped') }} Init stderr: {{ chezmoi_init_result.stderr | default('N/A - Init Skipped') }}
      when:
        - not internal_cache_home_dir_check.stat.exists
      tags: [always, chezmoi, config, verify]

    # --- Bitwarden Login (Non-Interactive using API Key) ---
    - name: Check Bitwarden CLI login status
      ansible.builtin.command:
        cmd: bw status # Assumes bw is in PATH (added by previous playbook/exports)
      register: bw_status_check
      changed_when: false
      failed_when: false # Allow failure if not logged in or bw not found
      become: false # Run as user
      environment: # Pass PATH explicitly in case .exports isn't sourced yet for this task
        PATH: "{{ lookup('env', 'HOME') }}/.cargo/bin:{{ ansible_env.PATH }}" # Add other paths if needed
      tags: [always, chezmoi, config, secrets, bw]

    - name: Display BW Status Before Login Attempt (Debug)
      ansible.builtin.debug:
        var: bw_status_check.stdout
      when: bw_status_check is defined and bw_status_check.stdout is defined
      tags: [debug, secrets, bw]

    - name: Log in to Bitwarden CLI using API Key (when needed)
      ansible.builtin.command:
        cmd: bw login --apikey --raw
      become: false
      when:
        # Ensure status check succeeded before evaluating its output
        - bw_status_check is defined
        - bw_status_check.rc == 0
        - bw_status_check.stdout is defined
        - not bw_status_check.stdout | regex_search('"unlocked"')
        # AND ensure API keys are defined (for safety)
        - (lookup('env', 'BW_CLIENTID', default='') != "" or bw_client_id is defined)
        - (lookup('env', 'BW_CLIENTSECRET', default='') != "" or bw_client_secret is defined)
      environment:
        BW_CLIENTID: "{{ lookup('env', 'BW_CLIENTID') | default(bw_client_id | default(''), true) }}"
        BW_CLIENTSECRET: "{{ lookup('env', 'BW_CLIENTSECRET') | default(bw_client_secret | default(''), true) }}"
      register: bw_login_result
      # Changed_when: check stderr for message confirming login OR already logged in with API key
      changed_when: >
        bw_login_result.rc == 0 and
        bw_login_result.stderr is defined and
        ("logged in" in bw_login_result.stderr | lower or
         "already logged in" in bw_login_result.stderr | lower)
      # Failed_when: Fail if rc is non-zero AND it wasn't just because already logged in
      failed_when: >
        bw_login_result.rc != 0 and
        (bw_login_result.stderr is not defined or
         "already logged in" not in bw_login_result.stderr | lower)
      no_log: true
      tags: [always, chezmoi, config, secrets, bw]

    - name: Synchronize Bitwarden CLI vault after login (if login occurred)
      ansible.builtin.command:
        cmd: bw sync
      become: false
      when: bw_login_result is defined and bw_login_result.changed | default(false)
      changed_when: false # Sync isn't a config change
      tags: [always, chezmoi, config, secrets, bw]

    # --- Chezmoi Application Steps (Requires Unlocked Vault) ---
    - name: Perform initial chezmoi apply (creates target config using -S)
      # Applies state for first time using source dir within internal cache.
      become: false # MUST run as user to inherit BW session/env
      ansible.builtin.command:
        cmd: >
          chezmoi
          -S {{ ansible_env.HOME }}/.local/share/chezmoi/home
          apply -vvv
      args:
        chdir: "{{ ansible_env.HOME }}"
        creates: "{{ ansible_env.HOME }}/.config/chezmoi/chezmoi.toml"
      when:
        - internal_cache_home_dir_check.stat.exists
        - not chezmoi_target_config_check_before_run.stat.exists
      register: initial_apply_result
      tags: [always, chezmoi, config, apply]

    - name: Display Initial Apply Result (Debug)
      ansible.builtin.debug:
        msg: |
          Initial Apply STDOUT:
          {{ initial_apply_result.stdout | default('N/A') }}
          Initial Apply STDERR:
          {{ initial_apply_result.stderr | default('N/A') }}
      when: initial_apply_result is defined and not initial_apply_result.skipped | default(false)
      tags: [always, chezmoi, config, apply, debug]

    - name: Check if chezmoi target configuration file exists (AFTER initial apply attempt)
      become: false
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.config/chezmoi/chezmoi.toml"
      register: chezmoi_target_config_check_after_apply
      tags: [always, chezmoi, config]

    - name: Display Target Config Check Result AFTER apply (Debug)
      ansible.builtin.debug:
        var: chezmoi_target_config_check_after_apply.stat
      tags: [always, chezmoi, config, debug]

    - name: Apply chezmoi changes on subsequent runs
      # Runs if the target config file now exists. Reads that config file.
      become: false # MUST run as user to inherit BW session/env
      ansible.builtin.command:
        cmd: "chezmoi apply -v" # Normal verbosity
      args:
        chdir: "{{ ansible_env.HOME }}"
      when: chezmoi_target_config_check_after_apply.stat.exists
      register: subsequent_apply_result
      changed_when: subsequent_apply_result.stdout is defined and subsequent_apply_result.stdout != ""
      tags: [always, chezmoi, config, apply]

    - name: Display Subsequent Apply Result (Debug)
      ansible.builtin.debug:
        var: subsequent_apply_result
      when: subsequent_apply_result is defined and not subsequent_apply_result.skipped | default(false)
      tags: [always, chezmoi, config, apply, debug]
