---
# playbooks/chezmoi.yml: Installs Chezmoi, initializes/updates source, and applies changes.
- hosts: all
  gather_facts: true

  vars:
    is_ci_env_var_set_to_true: "{{ lookup('env', 'CI') == 'true' }}"
    running_in_ci: "{{ is_ci_env_var_set_to_true }}"

    target_chezmoi_user: "{{ lookup('env', 'USER') if not running_in_ci else ansible_user | default('runner') }}"
    target_chezmoi_home: "{{ ansible_env.HOME }}"

    chezmoi_remote_repo_url: "https://github.com/shassen14/dotfiles.git"
    chezmoi_branch: "main"

    local_dotfiles_repo_checkout_path: "{{ target_chezmoi_home }}/dotfiles"

    # Define GITHUB_WORKSPACE from ansible_env if it exists, otherwise set to a placeholder for local runs
    # This makes it safe to reference later even if not in CI.
    _github_workspace_env: "{{ ansible_env.GITHUB_WORKSPACE if ansible_env.GITHUB_WORKSPACE is defined else 'NOT_IN_CI' }}"

    # --- Paths and Config for CI (these will use _github_workspace_env) ---
    chezmoi_ci_config_in_repo: "{{ _github_workspace_env }}/chezmoi.ci.toml"
    chezmoi_ci_apply_source_path: "{{ _github_workspace_env }}/home"

    chezmoi_target_config_file_path: "{{ target_chezmoi_home }}/.config/chezmoi/chezmoi.toml"

    # This definition is now safer because _github_workspace_env has a fallback.
    env_dotfiles_repo_root_for_main_config_template: "{{ _github_workspace_env if running_in_ci else local_dotfiles_repo_checkout_path }}"

    # This will be used by the 'chezmoi apply' task
    # It relies on the existence of chezmoi_bootstrap_config_in_repo or chezmoi_ci_config_in_repo
    # which are defined relative to local_dotfiles_repo_checkout_path or _github_workspace_env
    # The actual file check happens in the tasks section.
    # Let's define the paths to the bootstrap/CI config files here:
    actual_bootstrap_config_path: "{{ local_dotfiles_repo_checkout_path }}/chezmoi.bootstrap.toml"
    actual_ci_config_path: "{{ _github_workspace_env }}/chezmoi.ci.toml" # Uses the safe _github_workspace_env

  tasks:
    # --- 0. DEBUG ---
    - name: "DEBUG: Key variables for Chezmoi setup"
      ansible.builtin.debug:
        msg:
          - "Running in CI: {{ running_in_ci }}"
          - "Target Chezmoi User: {{ target_chezmoi_user }}"
          - "Target Chezmoi Home: {{ target_chezmoi_home }}"
          - "Local Dotfiles Repo Checkout Path (local): {{ local_dotfiles_repo_checkout_path }}"
          - "Remote Repo URL (for local init if local repo missing): {{ chezmoi_remote_repo_url }}"
          - "Path to Bootstrap Config in Repo (local first run): {{ actual_bootstrap_config_path }}"
          - "Path to CI Config in Repo (CI runs): {{ actual_ci_config_path if running_in_ci else 'N/A (Not in CI)' }}"
          - "Chezmoi Target Config File Path (final location): {{ chezmoi_target_config_file_path }}"
          # - "Effective Config File for 'chezmoi apply --config': {{ effective_apply_config_path }}" # This will be set in a later task
          - "GITHUB_WORKSPACE value used: {{ _github_workspace_env }}" # Display the safe version
          - "DOTFILES_REPO_ROOT env var for main config template: {{ env_dotfiles_repo_root_for_main_config_template }}"
      tags: [always, chezmoi, debug]

    # --- 1. Prerequisites & 2. Chezmoi Installation (same as your version, good) ---
    - name: Ensure git and curl are installed (Linux)
      become: true
      ansible.builtin.package:
        name: "git,curl"
        state: present
      when: ansible_os_family != "Darwin" # and not running_in_ci # Can keep for local if desired
      tags: [always, chezmoi, prerequisites]

    - name: Ensure git and curl are installed (macOS via Homebrew)
      community.general.homebrew:
        name: ["git", "curl"]
        state: present
      when: ansible_os_family == "Darwin" # and not running_in_ci
      tags: [always, chezmoi, prerequisites]

    - name: Install chezmoi via script (Linux)
      become: true
      ansible.builtin.shell:
        cmd: 'sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin'
      args:
        creates: /usr/local/bin/chezmoi
      when: ansible_os_family != "Darwin"
      tags: [always, chezmoi, install]

    - name: Ensure chezmoi via Homebrew (macOS)
      community.general.homebrew:
        name: chezmoi
        state: present
      when: ansible_os_family == "Darwin"
      tags: [always, chezmoi, install]

    # --- 3. Chezmoi Initialization (Ensure source repo is available to Chezmoi) ---
    - name: "Check if Chezmoi's internal source .git repo exists for '{{ target_chezmoi_user }}'"
      become: true # For become_user
      become_user: "{{ target_chezmoi_user }}"
      ansible.builtin.stat:
        path: "{{ target_chezmoi_home }}/.local/share/chezmoi/.git"
      register: chezmoi_internal_source_git_check
      tags: [always, chezmoi, init]

    - name: "Check if local dotfiles Git repo checkout exists (for local non-CI runs)"
      ansible.builtin.stat:
        path: "{{ local_dotfiles_repo_checkout_path }}/.git" # Path defined in vars
      register: local_dotfiles_repo_checkout_exists
      when: not running_in_ci
      tags: [always, chezmoi, init]

    - name: "Determine 'chezmoi init' source argument or remote URL"
      ansible.builtin.set_fact:
        chezmoi_init_actual_source_arg: >-
          {% if running_in_ci and ansible_env.GITHUB_WORKSPACE is defined %}
          --source={{ ansible_env.GITHUB_WORKSPACE }}
          {% elif not running_in_ci and local_dotfiles_repo_checkout_exists.stat is defined and local_dotfiles_repo_checkout_exists.stat.exists %}
          --source={{ local_dotfiles_repo_checkout_path }}
          {% else %}
          {{ chezmoi_remote_repo_url }}
          {% endif %}
      tags: [always, chezmoi, init]

    - name: "Initialize Chezmoi for '{{ target_chezmoi_user }}' (clones/updates internal cache)"
      become: true
      become_user: "{{ target_chezmoi_user }}"
      ansible.builtin.shell: # Using shell for cleaner command construction
        cmd: "chezmoi init {{ chezmoi_init_actual_source_arg }} --branch={{ chezmoi_branch }} --apply=false -v"
      args:
        chdir: "{{ target_chezmoi_home }}"
        creates: "{{ target_chezmoi_home }}/.local/share/chezmoi/.git" # Idempotent based on internal cache
      # Run if internal cache doesn't exist, OR if in CI (always uses GITHUB_WORKSPACE as source),
      # OR if local checkout exists (use local checkout as source). Otherwise, clones from remote.
      when: >
        not chezmoi_internal_source_git_check.stat.exists or
        (running_in_ci and ansible_env.GITHUB_WORKSPACE is defined) or
        (not running_in_ci and local_dotfiles_repo_checkout_exists.stat is defined and local_dotfiles_repo_checkout_exists.stat.exists and chezmoi_init_actual_source_arg != chezmoi_remote_repo_url)
      register: chezmoi_init_result
      changed_when: "'Cloned' in chezmoi_init_result.stdout or 'Initialized' in chezmoi_init_result.stdout or 'Updated' in chezmoi_init_result.stdout"
      tags: [always, chezmoi, init]

    - name: "Display Chezmoi Init Result (Debug)"
      ansible.builtin.debug:
        var: chezmoi_init_result
      when: chezmoi_init_result is defined and (chezmoi_init_result.changed or (chezmoi_init_result.rc | default(0)) != 0)
      tags: [always, chezmoi, init, debug]

    # --- 4. Chezmoi Apply ---
    # First pass: Use a bootstrap config if the target ~/.config/chezmoi/chezmoi.toml doesn't exist yet.
    # --- Task that determines effective_apply_config_path (moved from vars to tasks for proper sequencing) ---
    - name: "Check if target Chezmoi config '{{ chezmoi_target_config_file_path }}' exists"
      become: true # For become_user if needed, though stat as user is fine
      become_user: "{{ target_chezmoi_user }}"
      ansible.builtin.stat:
        path: "{{ chezmoi_target_config_file_path }}"
      register: target_config_exists_check
      tags: [always, chezmoi, apply] # Make sure it runs before apply

    - name: "Determine effective config path for 'chezmoi apply' command"
      ansible.builtin.set_fact:
        effective_apply_config_path: >-
          {% if running_in_ci %}
          {{ actual_ci_config_path }}
          {% elif not target_config_exists_check.stat.exists %}
          {{ actual_bootstrap_config_path }}
          {% else %}
          {{ chezmoi_target_config_file_path }}
          {% endif %}
      tags: [always, chezmoi, apply] # Make sure it runs before apply

    - name: "DEBUG: Effective config path chosen for apply" # Add this debug
      ansible.builtin.debug:
        var: effective_apply_config_path
      tags: [always, chezmoi, apply, debug]

    - name: "Apply Chezmoi changes for '{{ target_chezmoi_user }}' (using config: {{ effective_apply_config_path }})" # Use the fact
      become: true
      become_user: "{{ target_chezmoi_user }}"
      ansible.builtin.command:
        cmd: >-
          chezmoi apply
          --config {{ effective_apply_config_path }} {# This fact is now safely defined #}
          {% if running_in_ci %}
          --source {{ _github_workspace_env }}/home   {# Use safe _github_workspace_env #}
          --destination {{ target_chezmoi_home }}
          {% endif %}
          --force
          -v
      args:
        chdir: "{{ target_chezmoi_home }}"
      environment:
        USER: "{{ target_chezmoi_user }}"
        DOTFILES_REPO_ROOT: "{{ env_dotfiles_repo_root_for_main_config_template }}"
        # Pass HOME explicitly in case `become_user` doesn't fully set it for Chezmoi's env lookup
        HOME: "{{ target_chezmoi_home }}"
      register: chezmoi_apply_result_pass1
      changed_when: "'Applied' in chezmoi_apply_result_pass1.stdout or (chezmoi_apply_result_pass1.stdout | default('')).splitlines() | length > 1"
      tags: [always, chezmoi, apply]

    - name: "Display Chezmoi Apply Pass 1 Result (Debug)"
      ansible.builtin.debug:
        var: chezmoi_apply_result_pass1
      when: chezmoi_apply_result_pass1 is defined
      tags: [always, chezmoi, apply, debug]

    # Optional: Second apply pass for local runs if the first pass created/updated the main chezmoi.toml
    # This ensures that if chezmoi.toml itself was changed and contains new data/config,
    # other templates depending on that *new* data are re-evaluated correctly.
    # In CI, the ci.toml is static, so a second pass with it isn't strictly for data changes.
    - name: "Re-apply Chezmoi (local only, if main config was potentially just created/updated)"
      become: true
      become_user: "{{ target_chezmoi_user }}"
      ansible.builtin.command:
        cmd: >-
          chezmoi apply
          --config {{ chezmoi_target_config_file_path }}
          --force
          -v
      args:
        chdir: "{{ target_chezmoi_home }}"
      environment:
        USER: "{{ target_chezmoi_user }}"
        DOTFILES_REPO_ROOT: "{{ env_dotfiles_repo_root_for_main_config_template }}"
        HOME: "{{ target_chezmoi_home }}"
      register: chezmoi_apply_result_pass2
      changed_when: "'Applied' in chezmoi_apply_result_pass2.stdout or (chezmoi_apply_result_pass2.stdout | default('')).splitlines() | length > 1"
      when:
        - not running_in_ci
        # Run if the first apply pass actually ran (wasn't skipped) and might have created/changed the target config
        - chezmoi_apply_result_pass1 is defined
        - not (chezmoi_apply_result_pass1.skipped | default(false))
      tags: [always, chezmoi, apply]

    - name: "Display Chezmoi Apply Pass 2 Result (Debug)"
      ansible.builtin.debug:
        var: chezmoi_apply_result_pass2
      when: chezmoi_apply_result_pass2 is defined and not (chezmoi_apply_result_pass2.skipped | default(false))
      tags: [always, chezmoi, apply, debug]