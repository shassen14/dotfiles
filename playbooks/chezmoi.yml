# playbooks/chezmoi.yml: Installs Chezmoi, initializes repo, and applies changes.
# Assumes bootstrap.sh installed prerequisites and chezmoi binary.
- hosts: all
  gather_facts: true

  tasks:
    # --- Chezmoi Initialization and Application (Split Steps) ---
    - name: Check if chezmoi internal repository cache exists (.git dir)
      # Checks the default location where 'chezmoi init' clones the repo
      become: false
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.local/share/chezmoi/.git"
      register: chezmoi_internal_repo_git_check
      tags: [always, chezmoi, config]

    - name: Initialize chezmoi (clone repository only)
      # Clones the repo to internal cache if it doesn't exist. Does NOT apply yet.
      become: false
      ansible.builtin.command:
        # Run ONLY 'chezmoi init', NO '--apply' or '--source' or '--path'
        cmd: "chezmoi init --branch {{ chezmoi_branch }} {{ chezmoi_repo }}"
      args:
        chdir: "{{ ansible_env.HOME }}"
        # This task creates the internal repo cache
        creates: "{{ ansible_env.HOME }}/.local/share/chezmoi/.git"
      # Run only if the internal repo cache check shows it doesn't exist
      when: not chezmoi_internal_repo_git_check.stat.exists
      register: chezmoi_init_result
      tags: [always, chezmoi, config, init]

    - name: Display Init Result (Debug)
      ansible.builtin.debug:
        var: chezmoi_init_result
      when: chezmoi_init_result is defined and chezmoi_init_result.changed
      tags: [always, chezmoi, config, init, debug]

    - name: Check if chezmoi target configuration file exists (before initial apply)
      # Checks if the managed chezmoi.toml exists in the target location
      become: false
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.config/chezmoi/chezmoi.toml"
      register: chezmoi_target_config_check_before_apply
      tags: [always, chezmoi, config]

    - name: Display Target Config Check Result BEFORE apply (Debug)
      ansible.builtin.debug:
        var: chezmoi_target_config_check_before_apply.stat
      tags: [always, chezmoi, config, debug]

    - name: Perform initial chezmoi apply (creates target config using -S)
      # This task applies the state for the first time using the correct source within the cache.
      become: false
      ansible.builtin.command:
        # Use '-S' to specify the source dir *within the internal cache* for THIS apply only.
        cmd: >
          chezmoi
          -S {{ ansible_env.HOME }}/.local/share/chezmoi/home
          apply -vvv
      args:
        chdir: "{{ ansible_env.HOME }}"
        # 'creates:' ensures this task only runs effectively once until the target file exists
        creates: "{{ ansible_env.HOME }}/.config/chezmoi/chezmoi.toml"
      # Run only if the internal cache exists AND the target config is missing
      when:
        - chezmoi_internal_repo_git_check.stat.exists # Cache must exist
        - not chezmoi_target_config_check_before_apply.stat.exists # Target config must be missing
      register: initial_apply_result
      tags: [always, chezmoi, config, apply]

    - name: Display Initial Apply Result (CRITICAL DEBUG)
      ansible.builtin.debug:
        msg: |
          Initial Apply STDOUT:
          {{ initial_apply_result.stdout | default('N/A') }}
          Initial Apply STDERR:
          {{ initial_apply_result.stderr | default('N/A') }}
      # Run this debug task only if the apply task actually ran (wasn't skipped)
      when: initial_apply_result is defined and not initial_apply_result.skipped | default(false)
      tags: [always, chezmoi, config, apply, debug]

    - name: Check if chezmoi target configuration file exists (NOW check AFTER apply attempt)
      # We check the result AFTER the initial apply task has run
      become: false
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.config/chezmoi/chezmoi.toml"
      register: chezmoi_target_config_check_after_apply # Use a different variable name
      tags: [always, chezmoi, config]

    - name: Display Target Config Check Result AFTER apply (Debug)
      ansible.builtin.debug:
        var: chezmoi_target_config_check_after_apply.stat
      tags: [always, chezmoi, config, debug]

    - name: Apply chezmoi changes on subsequent runs
      # This task runs if the target config file now exists.
      # It relies on the managed chezmoi.toml existing, which correctly points sourceDir to ~/dotfiles/home
      become: false
      ansible.builtin.command:
        cmd: "chezmoi apply -v" # Normal verbosity for subsequent runs
      args:
        chdir: "{{ ansible_env.HOME }}"
      # Condition based on check AFTER initial apply attempt
      when: chezmoi_target_config_check_after_apply.stat.exists
      register: subsequent_apply_result
      changed_when: "'Applied' in subsequent_apply_result.stdout" # Example of parsing output
      tags: [always, chezmoi, config, apply]

    - name: Display Subsequent Apply Result (Debug)
      ansible.builtin.debug:
        var: subsequent_apply_result
      when: subsequent_apply_result is defined and not subsequent_apply_result.skipped | default(false)
      tags: [always, chezmoi, config, apply, debug]