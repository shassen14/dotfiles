---
# playbooks/chezmoi.yml: Installs Chezmoi, initializes repo, and applies changes.
- hosts: all
  gather_facts: true # For ansible_env, ansible_os_family
  # become: false # Default for the play, individual tasks can override

  vars:
    # --- User and Path Definitions ---
    # User for whom chezmoi will be set up.
    # In CI, ansible_user_id might be 'runner' or similar.
    # Locally, lookup('env','USER') is usually your logged-in user.
    target_chezmoi_user: "{{ lookup('env', 'USER') if ansible_env.CI != 'true' else ansible_user_id | default('runner') }}"
    target_chezmoi_home: "{{ ansible_env.HOME if ansible_env.CI != 'true' else '/home/' + target_chezmoi_user }}" # Adjust if CI user home is different

    # --- Chezmoi Configuration ---
    # Your Git repository for dotfiles
    chezmoi_repo_url: "https://github.com/shassen14/dotfiles.git" # e.g., github.com/yourusername/dotfiles.git
    chezmoi_branch: "main" # Or your default branch

    # --- CI Specific Configuration ---
    # Path to the CI-specific, non-templated chezmoi config within your checked-out repository
    # This file should exist at the root of your repo and contain the necessary [data].
    chezmoi_ci_config_in_repo: "{{ ansible_env.GITHUB_WORKSPACE }}/chezmoi.ci.toml" # Must exist in your repo for CI

    # Path where Chezmoi expects its config.
    # This is where your private_dot_config/chezmoi/chezmoi.toml.tmpl will create its output.
    chezmoi_target_config_file_path: "{{ target_chezmoi_home }}/.config/chezmoi/chezmoi.toml"

    # Determine which config file 'chezmoi apply' should use.
    # In CI: Always use the static chezmoi.ci.toml from the repo.
    # Locally: Use the target ~/.config/chezmoi/chezmoi.toml if it exists,
    # otherwise (for the very first local run), could also point to a bootstrap/CI config if you add one for local too,
    # or rely on 'chezmoi init' having set up a basic one.
    # For simplicity in this example: CI uses its dedicated config. Local relies on what 'init' or a prior 'apply' might establish.
    # A more robust local first run might also use a temporary bootstrap config if the main one is templated.
    ansible_chezmoi_config_for_apply: "{% if ansible_env.CI == 'true' %}{{ chezmoi_ci_config_in_repo }}{% else %}{{ chezmoi_target_config_file_path }}{% endif %}"

  tasks:
    # --- 0. Ensure User/Home Variables are Sensible (Debug) ---
    - name: "DEBUG: User and Path Variables"
      ansible.builtin.debug:
        msg:
          - "Target Chezmoi User: {{ target_chezmoi_user }}"
          - "Target Chezmoi Home: {{ target_chezmoi_home }}"
          - "Target Chezmoi Config Path: {{ chezmoi_target_config_file_path }}"
          - "Effective Config for Apply: {{ ansible_chezmoi_config_for_apply }}"
          - "CI Mode: {{ ansible_env.CI | default('false') }}"
          - "GITHUB_WORKSPACE: {{ ansible_env.GITHUB_WORKSPACE | default('Not set') }}"
      tags: [always, chezmoi, debug]

    # --- 1. Prerequisites (Git, Curl) ---
    - name: Ensure git and curl are installed (Linux)
      become: true
      ansible.builtin.package:
        name: [git, curl]
        state: present
      when: ansible_os_family != "Darwin"
      tags: [always, chezmoi, prerequisites]

    - name: Ensure git and curl are installed (macOS via Homebrew)
      # become: false # Homebrew module handles its own user context
      community.general.homebrew:
        name: [git, curl] # Curl is usually present, git often via Xcode tools or brew
        state: present
      when: ansible_os_family == "Darwin"
      tags: [always, chezmoi, prerequisites]

    # --- 2. Chezmoi Installation ---
    - name: Install chezmoi via script (Linux)
      become: true # Install to /usr/local/bin needs sudo
      ansible.builtin.shell:
        cmd: 'sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin'
      args:
        creates: /usr/local/bin/chezmoi
      when: ansible_os_family != "Darwin"
      tags: [always, chezmoi, install]

    - name: Ensure chezmoi via Homebrew (macOS)
      # become: false # Homebrew module handles its own user context
      community.general.homebrew:
        name: chezmoi
        state: present
      when: ansible_os_family == "Darwin"
      tags: [always, chezmoi, install]

    # --- 3. Chezmoi Initialization (Clone/Setup Source Repo) ---
    # This task ensures that Chezmoi knows where your dotfiles are.
    # It will clone them into ~/.local/share/chezmoi if not already there.
    - name: Check if Chezmoi source directory exists
      become: false # Check as the target user
      ansible.builtin.stat:
        path: "{{ target_chezmoi_home }}/.local/share/chezmoi/.git"
      register: chezmoi_source_dir_git_check
      tags: [always, chezmoi, init]

    - name: Initialize Chezmoi with your dotfiles repository (if not already initialized)
      become: true # For privilege to switch to target_chezmoi_user
      become_user: "{{ target_chezmoi_user }}"
      ansible.builtin.command:
        # In CI, DOTFILES_REPO_ROOT (github.workspace) is the source.
        # Locally, you'd typically init from your git remote.
        # This task aims to set up ~/.local/share/chezmoi correctly.
        # If GITHUB_WORKSPACE is set (CI), init from that local path.
        # Otherwise, init from the remote repository URL.
        cmd: >
          chezmoi init
          {% if ansible_env.CI == 'true' and ansible_env.DOTFILES_REPO_ROOT is defined %}
          --source={{ ansible_env.DOTFILES_REPO_ROOT }}
          {% else %}
          {{ chezmoi_repo_url }}
          {% endif %}
          --branch={{ chezmoi_branch }}
          --apply=false
          -v
      args:
        chdir: "{{ target_chezmoi_home }}" # Run in the user's home directory
        # Creates the internal .git directory if cloning, or updates if source is local.
        creates: "{{ target_chezmoi_home }}/.local/share/chezmoi/.git"
      when: not chezmoi_source_dir_git_check.stat.exists or (ansible_env.CI == 'true' and ansible_env.DOTFILES_REPO_ROOT is defined)
      register: chezmoi_init_result
      changed_when: "'Cloned' in chezmoi_init_result.stdout or 'Initialized' in chezmoi_init_result.stdout"
      tags: [always, chezmoi, init]

    - name: Display Chezmoi Init Result (Debug)
      ansible.builtin.debug:
        var: chezmoi_init_result
      when: chezmoi_init_result is defined and chezmoi_init_result.changed | default(false)
      tags: [always, chezmoi, init, debug]

    # --- 4. Chezmoi Apply ---
    # This is the crucial step.
    # In CI: it MUST use the static `chezmoi.ci.toml` from the repo root,
    #          which contains the [data] section needed for all templates,
    #          including for rendering the target `~/.config/chezmoi/chezmoi.toml`.
    # Locally: it will use `~/.config/chezmoi/chezmoi.toml`. If this is the very
    #          first run, `~/.config/chezmoi/chezmoi.toml` isn't there yet.
    #          The `chezmoi init --apply <repo>` handles this better for local first run.
    #          This playbook assumes local first run might need `chezmoi init <repo>` then `chezmoi apply`.

    - name: "Apply Chezmoi changes (using {{ ansible_chezmoi_config_for_apply }})"
      become: true
      become_user: "{{ target_chezmoi_user }}"
      ansible.builtin.command:
        # Construct the base command
        # For multi-line commands, ensure no unintended characters get passed.
        # Using an array format (argv) for 'command' module is often safer if not needing shell features.
        # However, since we have Jinja templating here, a shell string is common.
        cmd: |
          chezmoi apply \
            --config {{ ansible_chezmoi_config_for_apply }} \
            {% if ansible_env.CI == 'true' %}
            --source {{ ansible_env.GITHUB_WORKSPACE }}/home \
            --destination {{ target_chezmoi_home }} \
            {% endif %}
            --force \
            -v
      args:
        chdir: "{{ target_chezmoi_home }}"
      environment:
        USER: "{{ target_chezmoi_user }}"
        DOTFILES_REPO_ROOT: "{{ ansible_env.GITHUB_WORKSPACE if ansible_env.CI == 'true' else target_chezmoi_home + '/dotfiles' }}"
      register: chezmoi_apply_result
      changed_when: "'Applied' in chezmoi_apply_result.stdout or chezmoi_apply_result.stdout_lines | length > 1"
      tags: [always, chezmoi, apply]

    - name: Display Chezmoi Apply Result (Debug)
      ansible.builtin.debug:
        var: chezmoi_apply_result
      when: chezmoi_apply_result is defined # Always show for debugging
      tags: [always, chezmoi, apply, debug]
