[colors]
bg      = #282a36
bg-alt  = #44475a
fg      = #f8f8f2
fg-dim  = #6272a4
purple  = #bd93f9
cyan    = #8be9fd
green   = #50fa7b
orange  = #ffb86c
pink    = #ff79c6
red     = #ff5555
yellow  = #f1fa8c

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 32
radius = 0
fixed-center = true

background = ${colors.bg}
foreground = ${colors.fg}

line-size = 2

border-size = 0
padding-left = 1
padding-right = 2
module-margin = 1

font-0 = "FiraCode Nerd Font:style=Regular:size=10;2"

modules-left   = i3 xwindow
modules-center = spotify
modules-right  = cpu memory disk pulseaudio network date powermenu

tray-position = right
tray-padding  = 4

cursor-click  = pointer
cursor-scroll = ns-resize

[bar/secondary]
inherit = bar/main
modules-left   = i3
modules-center =
modules-right  =
tray-position  = none

[module/i3]
type = internal/i3
pin-workspaces = true
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false

label-mode            = %mode%
label-mode-padding    = 2
label-mode-foreground = ${colors.fg}
label-mode-background = ${colors.purple}

label-focused            = %index%
label-focused-background = ${colors.bg-alt}
label-focused-underline  = ${colors.purple}
label-focused-padding    = 2

label-unfocused            = %index%
label-unfocused-padding    = 2
label-unfocused-foreground = ${colors.fg-dim}

label-visible            = %index%
label-visible-background = ${colors.bg-alt}
label-visible-padding    = 2

label-urgent            = %index%
label-urgent-background = ${colors.red}
label-urgent-padding    = 2

[module/xwindow]
type = internal/xwindow
label            = %title%
label-maxlen     = 50
label-foreground = ${colors.fg-dim}
label-empty      = —
label-empty-foreground = ${colors.fg-dim}

[module/spotify]
type     = custom/script
exec     = playerctl metadata --format "{{ artist }} - {{ title }}" 2>/dev/null
exec-if  = playerctl status 2>/dev/null | grep -q "Playing\|Paused"
interval = 2
format-prefix            = "  "
format-prefix-foreground = ${colors.green}
label = %output:0:50%

[module/cpu]
type     = internal/cpu
interval = 2
format-prefix            = "  "
format-prefix-foreground = ${colors.cyan}
label = %percentage:2%%

[module/memory]
type     = internal/memory
interval = 4
format-prefix            = "  "
format-prefix-foreground = ${colors.pink}
label = %percentage_used%%

[module/disk]
type     = internal/fs
mount-0  = /
interval = 30
format-mounted-prefix            = "  "
format-mounted-prefix-foreground = ${colors.orange}
label-mounted = %free%

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix            = "  "
format-volume-prefix-foreground = ${colors.yellow}
format-volume = <format-prefix><label-volume>
label-volume  = %percentage%%

label-muted            = "  muted"
label-muted-foreground = ${colors.fg-dim}

click-right = pavucontrol &

[module/network]
type           = internal/network
interface-type = any
interval       = 3

format-connected-prefix            = "  "
format-connected-prefix-foreground = ${colors.green}
format-connected = <format-prefix><label-connected>
label-connected = %local_ip%

label-disconnected            = "  —"
label-disconnected-foreground = ${colors.fg-dim}

[module/date]
type     = internal/date
interval = 1
date     = %a %d %b
time     = %H:%M:%S
format-prefix            = "  "
format-prefix-foreground = ${colors.purple}
label = %date%  %time%

[module/powermenu]
type = custom/menu
expand-right = false
format-spacing = 1

label-open             =
label-open-foreground  = ${colors.red}
label-close            =  cancel
label-close-foreground = ${colors.fg-dim}
label-separator        = |
label-separator-foreground = ${colors.fg-dim}

menu-0-0      = sleep
menu-0-0-exec = systemctl suspend
menu-0-1      = reboot
menu-0-1-exec = reboot
menu-0-2      = power off
menu-0-2-exec = poweroff
