# ~/.config/starship.toml - Managed by Chezmoi
# Example Starship configuration. Customize as needed!
# See https://starship.rs/config/ for all options.
# Inserts a blank line between shell prompts
add_newline = false
# Set command timeout (ms)
command_timeout = 1000
# Format string determines the order of modules
format = """
[](fg:#555555)\
$os\
$username\
$hostname\
[](bg:#88A071 fg:#555555)\
$directory\
[](fg:#88A071 bg:#668AAA)\
$git_branch\
$git_status\
[](fg:#668AAA bg:#A47F9B)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$python\
$terraform\
$docker\
$kubernetes\
[](fg:#A47F9B bg:#333333)\
$time\
[ ](fg:#333333)\
$character\
"""

# $line_break\
# Requires a Nerd Font for the powerline symbols ()
# --- Module Configurations ---
[os]
format = "[$symbol]($style) "
style = "bg:#555555 fg:#DDDDDD bold"
disabled = false # Set to true to disable
symbols.Macos = "󰀵" # Nerd Font symbol for Apple
symbols.Ubuntu = "󰕈" # Nerd Font symbol for Ubuntu
symbols.Arch = "󰣇" # Nerd Font symbol for Arch
symbols.Fedora = "󰣛" # Nerd Font symbol for Fedora

# Add other OS symbols as needed
[username]
show_always = true
format = "[$user]($style) "
style_user = "bg:#555555 fg:#DDDDDD"
style_root = "bg:#555555 fg:#FF0000 bold" # Red for root

[hostname]
ssh_only = true # Show hostname only when SSH'd in
format = "[@](bg:#555555 fg:#AAAAAA)[$hostname]($style) "
style = "bg:#555555 fg:#DDDDDD bold"
disabled = false

[directory]
style = "bg:#88A071 fg:#000000 bold"
format = "[](fg:#555555 bg:#88A071)[ $path ]($style)[$read_only]($read_only_style)"
truncation_length = 2 # Show current dir + 1 parent
truncation_symbol = "../"
home_symbol = "~" # Use ~ for the home directory
read_only_style = "fg:#FF0000" # Style for read-only indicator
read_only = " 🔒" # Symbol for read-only indicator (optional)

[git_branch]
symbol = ""
style = "bg:#668AAA fg:#DDDDDD"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:#668AAA fg:#DDDDDD"
format = "[($all_status$ahead_behind )]($style)"
conflicted = "[](bold red)" # Nerd Font symbol
ahead = "[ $count](bold green)" # Nerd Font symbol
behind = "[ $count](bold red)" # Nerd Font symbol
diverged = "[ $ahead_count  $behind_count](bold yellow)"
untracked = "[? $count](bold bright-red)"
stashed = "[ $count](bold bright-cyan)"
modified = "[ $count](bold yellow)"
staged = '[ $count](bold green)'
renamed = "[󰑚 $count](bold purple)"
deleted = "[󰆴 $count](bold red)"

[time]
disabled = false
time_format = "%H:%M:%S" # Use '%T' for HH:MM:SS
style = "bg:#333333 fg:#AAAAAA"
format = '[ $time ]($style)'

[line_break]
disabled = false

[character] # Prompt character
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
vimcmd_symbol = "[❮](bold green) "

# Disable modules you don't use for faster prompt
[c]
disabled = true

[rust]
disabled = false

[golang]
disabled = true

[nodejs]
disabled = true

[php]
disabled = true

[java]
disabled = true

[kotlin]
disabled = true

[python]
disabled = false

[terraform]
disabled = true # Set to false if using terraform frequently

[docker]
disabled = false # Keep enabled if using docker

[kubernetes]
disabled = true # Set to false if using k8s frequently
