# Virtual audio channels for streaming mix.
# Each sink's .monitor port is tapped by the loopbacks in 20-stream-loopbacks.conf.
#
# Channels (apps route to these):
#   sink.system   — default for most apps
#   sink.discord  — Discord
#   sink.spotify  — Spotify
#   sink.obs      — OBS Studio audio output
#
# Mix outputs (final busses):
#   sink.personal — what you hear in headphones
#   sink.stream   — what OBS captures (add sink.stream.monitor as OBS audio source)

context.objects = [

    # ── Input Channels ──────────────────────────────────────────────────────────

    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = "sink.system"
          node.description = "System"
          media.class      = "Audio/Sink"
          audio.position   = "FL,FR"
      }
    }

    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = "sink.discord"
          node.description = "Discord"
          media.class      = "Audio/Sink"
          audio.position   = "FL,FR"
      }
    }

    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = "sink.spotify"
          node.description = "Spotify"
          media.class      = "Audio/Sink"
          audio.position   = "FL,FR"
      }
    }

    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = "sink.obs"
          node.description = "OBS Studio"
          media.class      = "Audio/Sink"
          audio.position   = "FL,FR"
      }
    }

    # ── Mix Outputs ─────────────────────────────────────────────────────────────

    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = "sink.personal"
          node.description = "Personal Mix"
          media.class      = "Audio/Sink"
          audio.position   = "FL,FR"
      }
    }

    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = "sink.stream"
          node.description = "Stream Mix"
          media.class      = "Audio/Sink"
          audio.position   = "FL,FR"
      }
    }
]
