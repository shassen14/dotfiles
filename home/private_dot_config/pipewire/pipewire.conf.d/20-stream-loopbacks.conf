# Loopback routing: taps each channel's monitor and feeds it into mix sinks.
# Each loopback is its own volume-controllable stream in qpwgraph/pavucontrol.
#
# Matrix:
#   Channel   → Personal   Stream
#   ───────────────────────────────
#   System    →    ✓         ✓
#   Discord   →    ✓         ✓    ← mute Discord→Stream in qpwgraph if unwanted
#   Spotify   →    ✓         ✗    ← omitted from Stream (copyright)
#   OBS       →    ✓         ✓
#   Mic       →    ✓         —    ← monitoring only; OBS captures easyeffects_source directly
#
# After first boot: open qpwgraph, wire sink.personal.monitor → your headphone
# device, and save the session (File → Save Session).

context.modules = [

    # ── System ──────────────────────────────────────────────────────────────────

    { name = libpipewire-module-loopback
      args = {
          node.name        = "loopback.system.personal"
          node.description = "System → Personal"
          capture.props = {
              stream.capture.sink = true
              node.target         = "sink.system"
              audio.position      = "FL,FR"
          }
          playback.props = {
              node.target    = "sink.personal"
              audio.position = "FL,FR"
              node.passive   = true
          }
      }
      flags = [ optional ]
    }

    { name = libpipewire-module-loopback
      args = {
          node.name        = "loopback.system.stream"
          node.description = "System → Stream"
          capture.props = {
              stream.capture.sink = true
              node.target         = "sink.system"
              audio.position      = "FL,FR"
          }
          playback.props = {
              node.target    = "sink.stream"
              audio.position = "FL,FR"
              node.passive   = true
          }
      }
      flags = [ optional ]
    }

    # ── Discord ─────────────────────────────────────────────────────────────────

    { name = libpipewire-module-loopback
      args = {
          node.name        = "loopback.discord.personal"
          node.description = "Discord → Personal"
          capture.props = {
              stream.capture.sink = true
              node.target         = "sink.discord"
              audio.position      = "FL,FR"
          }
          playback.props = {
              node.target    = "sink.personal"
              audio.position = "FL,FR"
              node.passive   = true
          }
      }
      flags = [ optional ]
    }

    { name = libpipewire-module-loopback
      args = {
          node.name        = "loopback.discord.stream"
          node.description = "Discord → Stream"
          capture.props = {
              stream.capture.sink = true
              node.target         = "sink.discord"
              audio.position      = "FL,FR"
          }
          playback.props = {
              node.target    = "sink.stream"
              audio.position = "FL,FR"
              node.passive   = true
          }
      }
      flags = [ optional ]
    }

    # ── Spotify ─────────────────────────────────────────────────────────────────

    { name = libpipewire-module-loopback
      args = {
          node.name        = "loopback.spotify.personal"
          node.description = "Spotify → Personal"
          capture.props = {
              stream.capture.sink = true
              node.target         = "sink.spotify"
              audio.position      = "FL,FR"
          }
          playback.props = {
              node.target    = "sink.personal"
              audio.position = "FL,FR"
              node.passive   = true
          }
      }
      flags = [ optional ]
    }

    # ── Spotify ─────────────────────────────────────────────────────────────────

    { name = libpipewire-module-loopback
      args = {
          node.name        = "loopback.spotify.stream"
          node.description = "Spotify → Stream"
          capture.props = {
              stream.capture.sink = true
              node.target         = "sink.spotify"
              audio.position      = "FL,FR"
          }
          playback.props = {
              node.target    = "sink.stream"
              audio.position = "FL,FR"
              node.passive   = true
          }
      }
      flags = [ optional ]
    }

    # ── OBS Studio ──────────────────────────────────────────────────────────────

    { name = libpipewire-module-loopback
      args = {
          node.name        = "loopback.obs.personal"
          node.description = "OBS → Personal"
          capture.props = {
              stream.capture.sink = true
              node.target         = "sink.obs"
              audio.position      = "FL,FR"
          }
          playback.props = {
              node.target    = "sink.personal"
              audio.position = "FL,FR"
              node.passive   = true
          }
      }
      flags = [ optional ]
    }

    { name = libpipewire-module-loopback
      args = {
          node.name        = "loopback.obs.stream"
          node.description = "OBS → Stream"
          capture.props = {
              stream.capture.sink = true
              node.target         = "sink.obs"
              audio.position      = "FL,FR"
          }
          playback.props = {
              node.target    = "sink.stream"
              audio.position = "FL,FR"
              node.passive   = true
          }
      }
      flags = [ optional ]
    }

    # ── Microphone Monitor ───────────────────────────────────────────────────────
    # Feeds your processed mic (EasyEffects output) into Personal mix so you can
    # hear yourself. Volume is controllable independently as "Mic Monitor → Personal"
    # in qpwgraph or pavucontrol. OBS captures easyeffects_source as a separate track.

    { name = libpipewire-module-loopback
      args = {
          node.name        = "loopback.mic.personal"
          node.description = "Mic Monitor → Personal"
          capture.props = {
              node.target    = "easyeffects_source"
              audio.position = "FL,FR"
          }
          playback.props = {
              node.target    = "sink.personal"
              audio.position = "FL,FR"
              node.passive   = true
          }
      }
      flags = [ optional ]
    }

    # ── Personal Mix → Headphones ────────────────────────────────────────────────
    # Final output: sends everything in your Personal mix to your USB DAC/headphones.
    # This is what you hear. Volume keys control sink.personal which scales this.

    { name = libpipewire-module-loopback
      args = {
          node.name        = "loopback.personal.headphones"
          node.description = "Personal Mix → Headphones"
          capture.props = {
              stream.capture.sink = true
              node.target         = "sink.personal"
              audio.position      = "FL,FR"
          }
          playback.props = {
              node.target    = "alsa_output.usb-TTGK_Technology_USB_Audio_33022920230925-00.analog-stereo"
              audio.position = "FL,FR"
          }
      }
      flags = [ optional ]
    }
]
