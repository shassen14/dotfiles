# ~/.config/picom/picom.conf
# Managed by Chezmoi: home/private_dot_config/picom/picom.conf
#
# Example Picom configuration file.
# See `man picom` for more information.
#
# For a more exhaustive list of options, see:
# https://github.com/yshui/picom/blob/next/picom.sample.conf

# --- Backend ---
# Prefer 'glx' for better performance if your drivers support it.
# 'xrender' is a fallback. 'xr_glx_hybrid' is also an option.
backend = "glx";
# vsync = true; # Enable vsync to prevent tearing. May cause issues on some systems.

# --- Shadows ---
# Enable shadows
shadow = true;
# Opacity of shadows. (0.0 - 1.0, defaults to 0.75)
# shadow-opacity = 0.7;
# The blur radius for shadows. (defaults to 12)
shadow-radius = 7;
# The left offset for shadows. (defaults to -15)
shadow-offset-x = -7;
# The top offset for shadows. (defaults to -15)
shadow-offset-y = -7;
# Red color value of shadow (0.0 - 1.0, defaults to 0).
# shadow-red = 0.0;
# Green color value of shadow (0.0 - 1.0, defaults to 0).
# shadow-green = 0.0;
# Blue color value of shadow (0.0 - 1.0, defaults to 0).
# shadow-blue = 0.0;
# Specify a list of conditions of windows that should have no shadow.
shadow-exclude = [
  "name = 'Notification'",    # Dunst or other notification windows
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'slop'",         # Used by 'maim' for selection
  "class_g = 'Firefox' && argb", # Fix for some Firefox transparency issues
  "class_g = 'jetbrains-idea' && focused", # No shadow for focused JetBrains IDEs (can look weird)
  "_GTK_FRAME_EXTENTS@:c",    # No shadow for server-side decorated windows (e.g., some GNOME apps)
  "_NET_WM_STATE@:32a = '_NET_WM_STATE_FULLSCREEN'" # No shadow for fullscreen windows
];
# Avoid drawing shadow on shaped windows. (legacy, defaults to false)
# shadow-ignore-shaped = false;

# --- Fading ---
# Fade windows during opacity changes.
fading = true;
# The time between steps in a fade in milliseconds. (default 10).
# fade-delta = 4;
# Opacity change between steps while fading in. (default 0.028).
# fade-in-step = 0.03;
# Opacity change between steps while fading out. (default 0.03).
# fade-out-step = 0.03;
# Fade windows in/out when opening/closing
# no-fading-openclose = false;
# Fade windows OUT when they are destroyed.
# no-fading-destroyed-argb = true;
# Specify a list of conditions of windows that should not be faded.
fade-exclude = [
  # "class_g = 'slop'"
];

# --- Opacity ---
# Opacity of inactive windows. (0.1 - 1.0, defaults to 1.0)
# inactive-opacity = 0.95;
# Opacity of active windows. (0.1 - 1.0, defaults to 1.0)
# active-opacity = 1.0;
# Opacity of window titlebars and borders. (0.1 - 1.0, defaults to 1.0)
# frame-opacity = 0.9;
# Default opacity for dropdown menus and popup menus. (0.0 - 1.0, defaults to 1.0)
# menu-opacity = 0.95;
# Let inactive-opacity override client-set opacity of windows.
# inactive-opacity-override = false;
# Specify a list of conditions of windows that should always be considered focused.
# focus-exclude = [ "class_g = 'Cairo-clock'" ];

# Opacity rules for specific windows
# Syntax: "OPACITY:CONDITION"
# Example: Make terminals slightly transparent
opacity-rule = [
  "90:class_g = 'com.mitchellh.ghostty' && focused",
  "85:class_g = 'com.mitchellh.ghostty' && !focused",
  "95:class_g = 'Brave-browser'",
  "100:class_g = 'mpv'",
  "90:class_g = 'Thunar'"
];

# --- Blur ---
# (Requires experimental backends, may impact performance. Test carefully.)
# blur: {
#   method = "dual_kawase"; # "none", "box", "gaussian", "kernel", "dual_kawase", "kawase"
#   strength = 5;          # Strength of the blur. Default 5.
#   # deviation = 1.0;     # Standard deviation for Gaussian blur.
#   # kernel = "3x3box";   # Example blur kernel
#   background = false;      # Blur background of semi-transparent windows.
#   background-frame = false; # Blur background of windows when the frame is not opaque.
#   background-fixed = false; # Use fixed blur strength rather than adjusting based on opacity.
#   # exclude = [ "window_type = 'dock'", "window_type = 'desktop'" ];
# }
# blur-background = true; # Old way to enable background blur, use section above instead

# --- General Settings ---
# Daemonize process. Fork to background after initialization. Causes issues with certain WMs.
# daemon = false; # Usually started with --daemon from i3 config if needed

# Specify refresh rate of a C_RATE screen to match the output rate.
# refresh-rate = 0; # 0 for auto

# Try to detect WM windows and mark them as active.
mark-wmwin-focused = true;
# Mark all non-basic windows (overrides) as focused.
mark-ovredir-focused = true;
# Use EWMH _NET_ACTIVE_WINDOW to determine currently focused window.
use-ewmh-active-win = true;
# Unredirect all windows if a full-screen opaque window is detected.
# Improves performance for full-screen applications (e.g., games).
unredir-if-possible = true;
# Delay before unredirecting screen. Potentially useful for animations.
# unredir-if-possible-delay = 0;
# Conditions of windows that shouldn't cause unredirection.
# unredir-if-possible-exclude = [];

# Detect rounded corners and treat them accordingly.
detect-rounded-corners = true;
# Detect _NET_WM_OPACITY on client windows, useful for window managers not handling it.
detect-client-opacity = true;
# Detect transient windows (pop-ups).
detect-transient = true;
# Use GLX_EXT_buffer_age to detect new content, then repaint accordingly.
# detect-dirty = true;

# GLX backend specific settings
glx-no-stencil = true; # Recommended for performance.
# glx-copy-from-front = false; # Avoid if possible.
# glx-use-copysubbuffermesa = false; # If MESA_GLX_ IndexPath_copysubbuffer is malfunctioning.
# glx-no-rebind-pixmap = false; # Avoid if possible.
# Use X Sync fence to sync clients' draw calls. REQUIRED on nvidia proprietary
# with the GLX backend — without it, windows render transparent/garbled.
# This is enabled so picom is safe to re-enable in i3 (config.tmpl startup section).
xrender-sync-fence = true;
# glx-swap-method = "undefined"; # "undefined", "exchange", "copy", "3", "4", "5", "6", or buffer-age when available.
                               # "undefined" or "buffer-age" are often good choices.

# Window type settings.
# Each rule is a condition matching windows of certain type(s)
# and a list of settings to apply to them.
wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.85; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; } # e.g. Desktop Docks like polybar, tint2
  dnd = { shadow = false; } # e.g. Drag and Drop indicator
  popup_menu = { opacity = 0.95; shadow = true; focus = true; }; # Most context menus
  dropdown_menu = { opacity = 0.95; shadow = true; focus = true; }; # Menus from menubars
  utility = { focus = true; shadow = true; opacity = 0.95; };
  notification = { shadow = true; opacity = 0.9; focus = false; }; # Dunst
  # desktop = { shadow = false; blur-background = false; } # Desktop widget like conky
  # splash = { shadow = false; } # Splash screens
};

# Log level.
# log-level = "warn"; # "debug", "info", "warn", "error"
# log-file = "/path/to/your/log/file"; # Overwrites existing file
