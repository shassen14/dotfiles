# This is a non-templated config file specifically for CI bootstrapping
# or for the first run of chezmoi if its main config is a template.

sourceDir = "{{ env "GITHUB_WORKSPACE" }}/home" # GITHUB_WORKSPACE is where the repo is checked out# Set sourceDir based on GitHub Actions environment
# This assumes your dotfiles content (the 'home' subdir) is at the root of the checkout

[data]
name = "Samir Hassen (CI)"
email = "ci_email@example.com"
terminal = "alacritty"
editor = "nvim"
browser = "brave-browser"

