# .github/workflows/main.yml
name: Main test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  setup:
    runs-on: ${{ matrix.os }}  # Matrix will define the OS for each job

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]  # Define the platforms to test
        include:
          - os: ubuntu-latest
          - os: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        # Default checkout to $GITHUB_WORKSPACE
  
      - name: Run bootstrap.sh
        env:
          CI: true
          # Set the variable pointing to the checkout directory root
          DOTFILES_REPO_PATH: ${{ github.workspace }}
        run: |
          set -e
          echo "Repository Path: $DOTFILES_REPO_PATH"
          ls -la "$DOTFILES_REPO_PATH" # Debug: Verify checkout contents
          chmod +x "$DOTFILES_REPO_PATH/bootstrap.sh"
          # Execute bootstrap using the workspace path
          "$DOTFILES_REPO_PATH/bootstrap.sh" "$DOTFILES_REPO_PATH/playbook.yml" "$DOTFILES_REPO_PATH/inventory.ini"
