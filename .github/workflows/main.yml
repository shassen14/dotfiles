# .github/workflows/main.yml
name: Main test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  setup:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repo to default workspace
        uses: actions/checkout@v4
        # No 'path' needed, checks out to $GITHUB_WORKSPACE

      - name: Run bootstrap.sh from workspace
        env:
          CI: true
          DOTFILES_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -e
          echo "Repository Path (DOTFILES_REPO_ROOT): $DOTFILES_REPO_ROOT"
          # ... (your bootstrap.sh execution) ...
          # The key is that when bootstrap.sh calls ansible-playbook,
          # and ansible-playbook calls chezmoi.yml,
          # the chezmoi.yml playbook needs to tell 'chezmoi apply' to use this CI config.
          "$DOTFILES_REPO_ROOT/bootstrap.sh" "$DOTFILES_REPO_ROOT/playbook.yml" "$DOTFILES_REPO_ROOT/inventory.ini"
        shell: bash
