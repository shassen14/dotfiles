# .github/workflows/main.yml
name: Main test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  setup:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Prevent other jobs from cancelling if one fails
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repo to ~/dotfiles # Action name updated
        uses: actions/checkout@v4 # Use latest checkout action
        with:
          # Use the runner context variable for home directory
          path: ${{ runner.home }}/dotfiles

      - name: Run bootstrap.sh from checkout path
        env:
          CI: true
        run: |
          set -e # Exit on error
          # Define path using runner context for consistency
          REPO_PATH="${{ runner.home }}/dotfiles"
          echo "Running bootstrap from: $REPO_PATH"
          # Make script executable
          chmod +x "$REPO_PATH/bootstrap.sh"
          # Execute script using absolute paths for clarity
          "$REPO_PATH/bootstrap.sh" "$REPO_PATH/playbook.yml" "$REPO_PATH/inventory.ini"
        # Specify shell for potential cross-platform consistency (optional)
        # shell: bash