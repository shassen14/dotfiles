# .github/workflows/main.yml
name: Main test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  setup:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repo to default workspace
        uses: actions/checkout@v4
        # No 'path' needed, checks out to $GITHUB_WORKSPACE

      - name: Run bootstrap.sh from workspace
        env:
          CI: true
          # Set environment variable pointing to the repo root in the workspace
          DOTFILES_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -e # Exit on any error in this script block
          echo "Repository Path (DOTFILES_REPO_ROOT): $DOTFILES_REPO_ROOT"
          ls -la "$DOTFILES_REPO_ROOT" # Debug: List contents
          chmod +x "$DOTFILES_REPO_ROOT/bootstrap.sh"
          # Execute script using paths relative to the workspace root
          "$DOTFILES_REPO_ROOT/bootstrap.sh" "$DOTFILES_REPO_ROOT/playbook.yml" "$DOTFILES_REPO_ROOT/inventory.ini"
        shell: bash