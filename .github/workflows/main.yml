name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  chezmoi-apply:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin

      - name: Apply dotfiles
        run: chezmoi apply --source "$GITHUB_WORKSPACE/home" --destination ~ --force
